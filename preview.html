  <style>/* ============================================================
   ViralQuest Report — Design System
   All visual values live here as custom properties.
   To retheme or repair the report, only edit this file.
   ============================================================ */

:root {
  /* --- Brand colours --- */
  --vq-primary:        #15314b;
  --vq-primary-light:  #25527d;
  --vq-accent:         #2f86d6;
  --vq-accent-dark:    #1a6cb8;
  --vq-accent-subtle:  #eaf3fb;
  --vq-success:        #1f9d6b;
  --vq-warning:        #e0921c;
  --vq-danger:         #d24a3d;
  --vq-muted:          #7f8c8d;

  /* --- Taxonomy family colours (calmer categorical palette) --- */
  --vq-tax-flaviviridae:   #c46a2a;
  --vq-tax-parvoviridae:   #6b4d99;
  --vq-tax-phenuiviridae:  #137d6f;
  --vq-tax-nodaviridae:    #2c5f8d;
  --vq-tax-rhabdoviridae:  #a8413a;
  --vq-tax-tombusviridae:  #4a8a4a;
  --vq-tax-other:          #8493a3;

  /* --- ORF domain colours --- */
  /* Tuned so none collides with the accent blue (which signals (+) ORFs). */
  --vq-dom-1: #d4554a;
  --vq-dom-2: #6a9bd1;   /* shifted from accent so domain bars stay distinguishable */
  --vq-dom-3: #4a9d6f;
  --vq-dom-4: #d49a3c;
  --vq-dom-5: #8e6cb6;
  --vq-dom-6: #2fa395;
  --vq-dom-7: #b97842;
  --vq-dom-8: #3f5366;

  /* --- Surfaces --- */
  --vq-bg:          #f3f6fa;
  --vq-surface:     #ffffff;
  --vq-surface-2:   #f7fafc;
  --vq-border:      #e2e8f0;
  --vq-border-dark: #c5d0dc;

  /* --- Text --- */
  --vq-text:        #1e293b;
  --vq-text-2:      #475569;
  --vq-text-3:      #94a3b8;

  /* --- Typography --- */
  --vq-font:        'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --vq-font-mono:   'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
  --vq-text-xs:     0.72rem;
  --vq-text-sm:     0.85rem;
  --vq-text-base:   1rem;
  --vq-text-lg:     1.15rem;
  --vq-text-xl:     1.35rem;
  --vq-text-2xl:    1.7rem;

  /* --- Spacing --- */
  --vq-space-1:  0.25rem;
  --vq-space-2:  0.5rem;
  --vq-space-3:  0.75rem;
  --vq-space-4:  1rem;
  --vq-space-6:  1.5rem;
  --vq-space-8:  2rem;
  --vq-space-12: 3rem;

  /* --- Shape --- */
  --vq-radius-sm: 10px;
  --vq-radius:    16px;
  --vq-radius-lg: 22px;
  --vq-shadow-sm: 0 1px 2px rgba(15, 49, 75, .04), 0 2px 6px rgba(15, 49, 75, .04);
  --vq-shadow:    0 4px 16px rgba(15, 49, 75, .07), 0 2px 4px rgba(15, 49, 75, .04);
  --vq-shadow-lg: 0 14px 36px rgba(15, 49, 75, .12), 0 6px 12px rgba(15, 49, 75, .06);

  /* --- Nav --- */
  --vq-nav-h:     58px;
  --vq-nav-bg:    var(--vq-primary);

  /* --- Transitions --- */
  --vq-ease:      cubic-bezier(.4,0,.2,1);
  --vq-dur:       180ms;
}

/* ============================================================
   Reset & base
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: var(--vq-font);
  font-size:   var(--vq-text-base);
  color:       var(--vq-text);
  background:  var(--vq-bg);
  line-height: 1.6;
  min-height:  100vh;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   Navigation
   ============================================================ */

.vq-nav {
  position:   fixed;
  top: 0; left: 0; right: 0;
  height:     var(--vq-nav-h);
  background: var(--vq-nav-bg);
  display:    flex;
  align-items: center;
  padding:    0 var(--vq-space-6);
  gap:        var(--vq-space-8);
  z-index:    1000;
  box-shadow: 0 1px 0 rgba(255,255,255,.08), 0 2px 12px rgba(0,0,0,.28);
}

.vq-nav__logo {
  flex-shrink: 0;
  display:     flex;
  align-items: center;
  gap:         var(--vq-space-2);
  height:      100%;
}

.vq-nav__logo img {
  height:  40px;
  width:   auto;
  display: block;
  /* Logo art is dark navy/blue on transparent; invert-ish for the dark nav */
  /* filter: brightness(0) invert(1); */
  opacity: .96;
}

.vq-nav__tabs {
  display:    flex;
  gap:        0;
  flex:       1;
  overflow-x: auto;
  scrollbar-width: none;
  height:     var(--vq-nav-h);
  align-items: stretch;
}

.vq-nav__tabs::-webkit-scrollbar { display: none; }

.vq-nav__tab {
  padding:         0 var(--vq-space-4);
  border:          none;
  background:      transparent;
  color:           rgba(255,255,255,.6);
  font:            inherit;
  font-size:       var(--vq-text-sm);
  font-weight:     500;
  cursor:          pointer;
  white-space:     nowrap;
  position:        relative;
  border-bottom:   3px solid transparent;
  transition:      color      var(--vq-dur) var(--vq-ease),
                   border-color var(--vq-dur) var(--vq-ease);
}

.vq-nav__tab:hover  { color: rgba(255,255,255,.88); }
.vq-nav__tab[aria-selected="true"],
.vq-nav__tab.active {
  color:               #fff;
  border-bottom-color: var(--vq-accent);
  font-weight:         600;
}

.vq-nav__tab:focus-visible {
  outline:        2px solid var(--vq-accent);
  outline-offset: -4px;
  border-radius:  3px;
}

.vq-nav__meta {
  font-size:  var(--vq-text-xs);
  color:      rgba(255,255,255,.45);
  flex-shrink: 0;
  display:    flex;
  align-items: center;
  gap:        var(--vq-space-2);
}

/* ============================================================
   Main layout
   ============================================================ */

.vq-main {
  padding-top: var(--vq-nav-h);
  min-height:  100vh;
}

.vq-section {
  display:    none;
  padding:    var(--vq-space-6) var(--vq-space-6);
  max-width:  1600px;
  margin:     0 auto;
  animation:  vq-fadein var(--vq-dur) var(--vq-ease);
}

.vq-section.active { display: block; }

@keyframes vq-fadein {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0);   }
}

/* ============================================================
   Cards
   ============================================================ */

.vq-card {
  background:    var(--vq-surface);
  border:        1px solid var(--vq-border);
  border-radius: var(--vq-radius);
  box-shadow:    var(--vq-shadow-sm);
  overflow:      hidden;
}
.vq-card__header {
  padding:     10px var(--vq-space-4);
  border-bottom: 1px solid var(--vq-border);
  display:     flex;
  align-items: center;
  justify-content: space-between;
  gap:         var(--vq-space-4);
  background:  var(--vq-surface-2);
}

.vq-card__title {
  font-size:   var(--vq-text-sm);
  font-weight: 600;
  color:       var(--vq-primary);
  display:     flex;
  align-items: center;
  gap:         var(--vq-space-2);
  letter-spacing: .01em;
}

.vq-card__body {
  padding: var(--vq-space-4) var(--vq-space-4);
}

/* ============================================================
   Stats grid
   ============================================================ */

.vq-stats-grid {
  display:               grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap:                   var(--vq-space-2);
}

.vq-stat-chip {
  background:    var(--vq-surface);
  border:        1px solid var(--vq-border);
  border-radius: var(--vq-radius);
  padding:       14px 16px;
  display:       flex;
  flex-direction: column;
  gap:           4px;
  min-width:     0;
  position:      relative;
  overflow:      hidden;
  transition:    box-shadow var(--vq-dur) var(--vq-ease),
                 transform  var(--vq-dur) var(--vq-ease);
}

.vq-stat-chip::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--vq-border);
  transition: background var(--vq-dur) var(--vq-ease);
}

.vq-stat-chip:hover {
  box-shadow: var(--vq-shadow-sm);
  transform:  translateY(-1px);
}
.vq-stat-chip:hover::before { background: var(--vq-accent); }

.vq-stat-chip--accent::before  { background: var(--vq-accent);  }
.vq-stat-chip--success::before { background: var(--vq-success); }
.vq-stat-chip--warn::before    { background: var(--vq-warning); }

.vq-stat-chip__label {
  font-size:    11px;
  font-weight:  500;
  color:        var(--vq-text-3);
  letter-spacing: .02em;
}

.vq-stat-chip__value {
  font-size:    1.5rem;
  font-weight:  700;
  color:        var(--vq-primary);
  line-height:  1.15;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  white-space:  nowrap;
  overflow:     hidden;
  text-overflow: ellipsis;
}

.vq-stat-chip__value--text {
  font-size:    var(--vq-text-sm);
  font-weight:  600;
  font-family:  var(--vq-font-mono);
  letter-spacing: -.01em;
}

.vq-stat-chip__sub {
  font-size:  11px;
  color:      var(--vq-text-3);
  white-space: nowrap;
  overflow:    hidden;
  text-overflow: ellipsis;
}

.vq-stat-chip--accent  .vq-stat-chip__value { color: var(--vq-accent); }
.vq-stat-chip--success .vq-stat-chip__value { color: var(--vq-success); }
.vq-stat-chip--warn    .vq-stat-chip__value { color: var(--vq-warning); }

/* ============================================================
   Section headers
   ============================================================ */

.vq-section-header {
  display:       flex;
  align-items:   center;
  justify-content: space-between;
  margin-bottom: var(--vq-space-4);
  flex-wrap:     wrap;
  gap:           var(--vq-space-3);
}

.vq-section-title {
  font-size:   var(--vq-text-lg);
  font-weight: 600;
  color:       var(--vq-primary);
  display:     flex;
  align-items: baseline;
  gap:         var(--vq-space-2);
  letter-spacing: -.01em;
}

.vq-count-label {
  font-size:   var(--vq-text-sm);
  font-weight: 400;
  color:       var(--vq-text-3);
}

.vq-section-sub {
  font-size:  var(--vq-text-sm);
  color:      var(--vq-text-3);
  margin-top: var(--vq-space-1);
}

.vq-section-actions {
  display:   flex;
  gap:       var(--vq-space-2);
  flex-wrap: wrap;
  align-items: center;
}

/* ============================================================
   Buttons
   ============================================================ */

.vq-btn {
  display:       inline-flex;
  align-items:   center;
  gap:           var(--vq-space-2);
  padding:       var(--vq-space-2) var(--vq-space-4);
  border:        1px solid transparent;
  border-radius: 999px;
  font:          inherit;
  font-size:     var(--vq-text-sm);
  font-weight:   500;
  cursor:        pointer;
  transition:    background var(--vq-dur) var(--vq-ease),
                 color      var(--vq-dur) var(--vq-ease),
                 box-shadow var(--vq-dur) var(--vq-ease);
  white-space:   nowrap;
  text-decoration: none;
}

.vq-btn:focus-visible {
  outline: 2px solid var(--vq-accent);
  outline-offset: 2px;
}

.vq-btn:disabled { opacity: .5; cursor: not-allowed; }

.vq-btn--primary {
  background:   var(--vq-primary);
  color:        #fff;
  border-color: var(--vq-primary-light);
}
.vq-btn--primary:hover:not(:disabled) {
  background: var(--vq-primary-light);
  box-shadow: var(--vq-shadow-sm);
}

.vq-btn--accent {
  background: var(--vq-accent);
  color:      #fff;
}
.vq-btn--accent:hover:not(:disabled) { background: var(--vq-accent-dark); }

.vq-btn--ghost {
  background:   transparent;
  color:        var(--vq-text-2);
  border-color: var(--vq-border);
}
.vq-btn--ghost:hover:not(:disabled) {
  background:   var(--vq-surface-2);
  border-color: var(--vq-accent);
  color:        var(--vq-accent);
}

.vq-btn--sm {
  padding:    var(--vq-space-1) var(--vq-space-3);
  font-size:  var(--vq-text-xs);
}

/* ============================================================
   Dropdown menu (used by export controls)
   ============================================================ */

.vq-menu {
  position: relative;
  display:  inline-block;
}

.vq-menu__panel {
  position:      absolute;
  top:           calc(100% + 4px);
  right:         0;
  min-width:     140px;
  background:    var(--vq-surface);
  border:        1px solid var(--vq-border);
  border-radius: var(--vq-radius-sm);
  box-shadow:    var(--vq-shadow);
  padding:       4px;
  display:       none;
  z-index:       100;
}

.vq-menu.open > .vq-menu__panel { display: block; }

.vq-menu__item {
  display:        flex;
  align-items:    center;
  gap:            var(--vq-space-2);
  width:          100%;
  padding:        6px 10px;
  border:         none;
  background:     transparent;
  font:           inherit;
  font-size:      var(--vq-text-xs);
  color:          var(--vq-text-2);
  cursor:         pointer;
  border-radius:  4px;
  text-align:     left;
}

.vq-menu__item:hover { background: var(--vq-surface-2); color: var(--vq-accent); }

/* ============================================================
   Form controls
   ============================================================ */

.vq-input, .vq-select {
  padding:       8px 14px;
  border:        1px solid var(--vq-border);
  border-radius: 999px;
  font:          inherit;
  font-size:     var(--vq-text-sm);
  color:         var(--vq-text);
  background:    var(--vq-surface);
  outline:       none;
  transition:    border-color var(--vq-dur) var(--vq-ease),
                 box-shadow   var(--vq-dur) var(--vq-ease);
  width:         100%;
}

.vq-input:focus, .vq-select:focus {
  border-color: var(--vq-accent);
  box-shadow:   0 0 0 3px rgba(47,134,214,.15);
}

.vq-search-wrap {
  position:  relative;
  max-width: 360px;
  flex:      1;
}

.vq-search-wrap .vq-input {
  border-radius: 999px;
  padding-left:  2.4rem;
  background:    var(--vq-surface);
  border-color:  var(--vq-border);
}

.vq-search-wrap .vq-input::placeholder { color: var(--vq-text-3); }

.vq-search-wrap svg {
  position: absolute;
  left: var(--vq-space-3);
  top: 50%; transform: translateY(-50%);
  color: var(--vq-text-3);
  pointer-events: none;
  width: 15px; height: 15px;
}

/* ============================================================
   Toolbar
   ============================================================ */

.vq-toolbar {
  display:       flex;
  align-items:   center;
  flex-wrap:     wrap;
  gap:           var(--vq-space-3);
  margin-bottom: var(--vq-space-4);
}

.vq-toolbar__filters {
  display:   flex;
  gap:       var(--vq-space-2);
  flex-wrap: wrap;
  flex:      1;
}

.vq-select { width: auto; min-width: 130px; border-radius: var(--vq-radius-sm); }

/* ============================================================
   Toggle
   ============================================================ */

.vq-toggle {
  display:       inline-flex;
  border:        1px solid var(--vq-border);
  border-radius: 999px;
  overflow:      hidden;
  padding:       3px;
  gap:           2px;
  background:    var(--vq-surface);
}

.vq-toggle__btn {
  padding:       4px 14px;
  border:        none;
  background:    transparent;
  font:          inherit;
  font-size:     var(--vq-text-sm);
  cursor:        pointer;
  color:         var(--vq-text-2);
  border-radius: 999px;
  transition:    background var(--vq-dur) var(--vq-ease),
                 color      var(--vq-dur) var(--vq-ease);
}

.vq-toggle__btn.active {
  background: var(--vq-primary);
  color:      #fff;
  font-weight: 500;
}

/* ============================================================
   Badges / tags
   ============================================================ */

.vq-badge {
  display:       inline-flex;
  align-items:   center;
  padding:       2px 9px;
  border-radius: 999px;
  font-size:     var(--vq-text-xs);
  font-weight:   600;
  white-space:   nowrap;
}

.vq-badge--viral-known    { background: #e6f4ea; color: #1f7a3c; }
.vq-badge--viral-unknown  { background: #fef3d7; color: #9b6a09; }
.vq-badge--non-viral      { background: #fbe3e6; color: #a8302b; }
.vq-badge--cluster        { background: var(--vq-accent-subtle); color: var(--vq-accent-dark); }

.vq-tag {
  display:       inline-flex;
  align-items:   center;
  padding:       3px 10px;
  border-radius: 999px;
  border:        1px solid #d0e2f3;
  background:    var(--vq-accent-subtle);
  color:         var(--vq-accent-dark);
  font-size:     var(--vq-text-xs);
  font-weight:   500;
  white-space:   nowrap;
  gap:           4px;
  transition:    background var(--vq-dur) var(--vq-ease);
}

.vq-tag:hover { background: #d6e8f7; }

.vq-tag-row {
  display:    flex;
  flex-wrap:  wrap;
  gap:        var(--vq-space-2);
  margin-top: var(--vq-space-2);
}

/* ============================================================
   Genome viewer — sequence card
   ============================================================ */

.vq-seq-card {
  background:    var(--vq-surface);
  border:        1px solid var(--vq-border);
  border-left:   3px solid var(--vq-border);
  border-radius: var(--vq-radius);
  overflow:      hidden;
  transition:    border-left-color var(--vq-dur) var(--vq-ease),
                 box-shadow        var(--vq-dur) var(--vq-ease),
                 background        var(--vq-dur) var(--vq-ease);
}

.vq-seq-card:hover {
  border-left-color: var(--vq-accent);
  box-shadow:        var(--vq-shadow);
}

/* Highlight flash when jumped-to from another section. */
.vq-seq-card--highlight {
  border-left-color: var(--vq-accent);
  box-shadow:        0 0 0 3px rgba(47,134,214,.18), var(--vq-shadow);
  animation:         vq-flash 2s var(--vq-ease);
}

@keyframes vq-flash {
  0%   { background: rgba(47,134,214,.10); }
  60%  { background: rgba(47,134,214,.04); }
  100% { background: var(--vq-surface); }
}

.vq-seq-card__head {
  display:     flex;
  align-items: center;
  gap:         var(--vq-space-3);
  padding:     var(--vq-space-3) var(--vq-space-4);
  background:  var(--vq-surface);
  cursor:      pointer;
  user-select: none;
  border-bottom: 1px solid transparent;
  transition:  border-color var(--vq-dur) var(--vq-ease),
               background   var(--vq-dur) var(--vq-ease);
}

.vq-seq-card__head:hover    { background: var(--vq-surface-2); }
.vq-seq-card.open .vq-seq-card__head {
  border-bottom-color: var(--vq-border);
  background: var(--vq-surface-2);
}

.vq-seq-card__id {
  font-family: var(--vq-font-mono);
  font-size:   12px;
  font-weight: 600;
  color:       var(--vq-primary);
  flex-shrink: 0;
}

.vq-seq-card__meta {
  display:   flex;
  gap:       var(--vq-space-3);
  flex-wrap: wrap;
  flex:      1;
  font-size: 11.5px;
  color:     var(--vq-text-2);
  align-items: center;
  min-width: 0;
}

.vq-seq-card__meta-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

.vq-seq-card__meta-label {
  color: var(--vq-text-3);
  font-weight: 500;
}

.vq-seq-card__chevron {
  margin-left: auto;
  flex-shrink: 0;
  color:       var(--vq-text-3);
  transition:  transform var(--vq-dur) var(--vq-ease);
}

.vq-seq-card.open .vq-seq-card__chevron { transform: rotate(90deg); }

.vq-seq-card__body {
  display:    none;
  padding:    var(--vq-space-4);
}

.vq-seq-card.open .vq-seq-card__body { display: block; }

.vq-genome-wrap {
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: var(--vq-space-2);
}

.vq-genome-svg { display: block; min-width: 600px; }
.vq-genome-svg--fluid { min-width: 0; width: 100%; }

/* ============================================================
   Legend
   ============================================================ */

.vq-legend {
  display:    flex;
  flex-wrap:  wrap;
  gap:        var(--vq-space-3);
  font-size:  var(--vq-text-xs);
  color:      var(--vq-text-2);
  margin-top: var(--vq-space-3);
}

.vq-legend__item {
  display:    flex;
  align-items: center;
  gap:        var(--vq-space-1);
}

.vq-legend__swatch {
  width:         12px;
  height:        12px;
  border-radius: 3px;
  flex-shrink:   0;
}

/* Continuous gradient legend (used for % identity). */
.vq-gradient-legend {
  display:     inline-flex;
  align-items: center;
  gap:         var(--vq-space-2);
  font-size:   var(--vq-text-xs);
  color:       var(--vq-text-3);
}

.vq-gradient-legend__bar {
  width:         140px;
  height:        8px;
  border-radius: 4px;
  background:    linear-gradient(to right,
                  #a50026 0%, #d73027 12%, #f46d43 25%, #fdae61 37%,
                  #fee08b 50%, #d9ef8b 62%, #a6d96a 75%, #66bd63 87%, #1a9850 100%);
}

.vq-gradient-legend__ticks {
  display:        flex;
  justify-content: space-between;
  width:          140px;
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   Tooltip
   ============================================================ */

.vq-tooltip {
  position:      fixed;
  background:    rgba(15,23,42,.94);
  color:         #fff;
  border-radius: var(--vq-radius-sm);
  padding:       var(--vq-space-2) var(--vq-space-3);
  font-size:     var(--vq-text-xs);
  line-height:   1.5;
  pointer-events: none;
  z-index:       9000;
  max-width:     280px;
  box-shadow:    var(--vq-shadow-lg);
  opacity:       0;
  transition:    opacity 100ms;
}

.vq-tooltip.visible { opacity: 1; }

.vq-tooltip__title {
  font-weight:   600;
  margin-bottom: 4px;
  font-size:     var(--vq-text-xs);
}

.vq-tooltip__row {
  display:         grid;
  grid-template-columns: auto 1fr;
  gap:             2px 8px;
  color:           rgba(255,255,255,.85);
}

.vq-tooltip__key { color: rgba(255,255,255,.55); }

/* ============================================================
   Meta row
   ============================================================ */

.vq-meta-row {
  display:     flex;
  align-items: center;
  gap:         var(--vq-space-2);
  font-size:   var(--vq-text-xs);
  color:       var(--vq-text-3);
  margin-top:  var(--vq-space-2);
}

.vq-meta-row__sep { color: var(--vq-border-dark); }

/* ============================================================
   Checkbox
   ============================================================ */

.vq-checkbox {
  width:  16px;
  height: 16px;
  cursor: pointer;
  accent-color: var(--vq-accent);
  flex-shrink: 0;
}

/* ============================================================
   Empty state
   ============================================================ */

.vq-empty {
  text-align:  center;
  padding:     var(--vq-space-12) var(--vq-space-8);
  color:       var(--vq-text-3);
  font-size:   var(--vq-text-sm);
}

.vq-empty__icon {
  font-size:     2rem;
  margin-bottom: var(--vq-space-3);
  opacity:       .4;
}

/* ============================================================
   Stats dashboard layout
   ============================================================ */

.vq-stats-page {
  display: flex;
  flex-direction: column;
  gap: var(--vq-space-3);
}

.vq-stats-row {
  display: grid;
  gap: var(--vq-space-3);
}

.vq-stats-row--top {
  /* Hero KPIs */
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
}

.vq-stats-row--charts {
  /* Three side-by-side charts */
  grid-template-columns: 1.2fr 1fr 1fr;
}

@media (max-width: 1100px) {
  .vq-stats-row--charts { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 720px) {
  .vq-stats-row--charts { grid-template-columns: 1fr; }
}

.vq-chart-card {
  display: flex;
  flex-direction: column;
  background: var(--vq-surface);
  border: 1px solid var(--vq-border);
  border-radius: var(--vq-radius-lg);
  box-shadow: var(--vq-shadow-sm);
  padding: 18px 18px 16px;
  min-height: 290px;
  overflow: hidden;
}

.vq-chart-card__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.vq-chart-card__title {
  font-size: 13px;
  font-weight: 600;
  color: var(--vq-text);
  letter-spacing: -.01em;
}

.vq-chart-card__sub {
  font-size: 11px;
  color: var(--vq-text-3);
  margin-top: 2px;
}

.vq-chart-card__big {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--vq-primary);
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  margin-top: 6px;
}

.vq-chart-card__body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  min-height: 0;
}

/* Inline legend rows for charts */
.vq-chart-legend {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 11.5px;
}

.vq-chart-legend__row {
  display: grid;
  grid-template-columns: 12px 1fr auto auto;
  gap: 8px;
  align-items: center;
  color: var(--vq-text-2);
  padding: 2px 0;
}

.vq-chart-legend__dot {
  width: 10px; height: 10px;
  border-radius: 50%;
}

.vq-chart-legend__pct {
  color: var(--vq-text-3);
  font-variant-numeric: tabular-nums;
  font-size: 11px;
}

.vq-chart-legend__count {
  color: var(--vq-text);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* Pill that floats inside the donut */
.vq-donut-center {
  font-size: 11px;
  color: var(--vq-text-3);
  text-align: center;
}
.vq-donut-center strong {
  display: block;
  font-size: 1.55rem;
  color: var(--vq-primary);
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1.1;
}

/* ============================================================
   Inner panel (used inside expanded sequence cards)
   ============================================================ */

.vq-panel {
  background:    var(--vq-surface-2);
  border:        1px solid var(--vq-border);
  border-radius: var(--vq-radius-sm);
  overflow:      hidden;
  margin-top:    var(--vq-space-3);
}

.vq-panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid var(--vq-border);
  background: var(--vq-surface);
}

.vq-panel__title {
  font-size: 12px;
  font-weight: 600;
  color: var(--vq-text);
  letter-spacing: .01em;
  display: flex;
  align-items: center;
  gap: 6px;
}

.vq-panel__count {
  font-size: 11px;
  font-weight: 500;
  color: var(--vq-text-3);
  background: var(--vq-bg);
  padding: 1px 8px;
  border-radius: 999px;
}

.vq-panel__body {
  padding: 0;
  max-height: 320px;
  overflow: auto;
}

/* Inline tab strip — used to switch BLAST hit types inside a panel */
.vq-subtabs {
  display: flex;
  gap: 0;
  background: var(--vq-surface);
  border-bottom: 1px solid var(--vq-border);
}

.vq-subtab {
  padding: 6px 12px;
  border: none;
  background: transparent;
  font: inherit;
  font-size: 11px;
  font-weight: 500;
  color: var(--vq-text-3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color var(--vq-dur), border-color var(--vq-dur);
}

.vq-subtab:hover { color: var(--vq-text-2); }
.vq-subtab.active {
  color: var(--vq-accent-dark);
  border-bottom-color: var(--vq-accent);
}

.vq-subtab__count {
  margin-left: 6px;
  font-size: 10px;
  color: var(--vq-text-3);
  font-weight: 500;
}

/* Section label inside expanded sequence body */
.vq-body-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--vq-text-3);
  letter-spacing: .04em;
  text-transform: uppercase;
  margin: var(--vq-space-3) 0 6px;
}

.vq-body-label:first-child { margin-top: 0; }

/* FASTA / sequence preview block */
.vq-fasta {
  font-family: var(--vq-font-mono);
  font-size: 11px;
  color: var(--vq-text-2);
  background: var(--vq-bg);
  border: 1px solid var(--vq-border);
  border-radius: var(--vq-radius-sm);
  padding: 8px 10px;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.4;
  max-height: 140px;
  overflow: auto;
}

/* ============================================================
   Table
   ============================================================ */

.vq-table {
  width:            100%;
  border-collapse:  collapse;
  font-size:        12px;
}

.vq-table th {
  text-align:    left;
  padding:       6px 10px;
  border-bottom: 1px solid var(--vq-border);
  color:         var(--vq-text-3);
  font-weight:   500;
  font-size:     11px;
  letter-spacing: .02em;
  background:    var(--vq-surface);
  position:      sticky;
  top:           0;
  z-index:       1;
}

.vq-table td {
  padding:       6px 10px;
  border-bottom: 1px solid var(--vq-border);
  color:         var(--vq-text-2);
  font-size:     11.5px;
}

.vq-table tr:last-child td { border-bottom: none; }
.vq-table tbody tr:hover td { background: var(--vq-surface-2); }
.vq-table .vq-td--mono     { font-family: var(--vq-font-mono); font-size: 11px; }
.vq-table .vq-td--num      { font-variant-numeric: tabular-nums; }

/* ============================================================
   Scrollbar
   ============================================================ */

::-webkit-scrollbar         { width: 9px; height: 9px; }
::-webkit-scrollbar-track   { background: transparent; }
::-webkit-scrollbar-thumb   { background: var(--vq-border-dark); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--vq-muted); }

/* ============================================================
   Print
   ============================================================ */

@media print {
  .vq-nav, .vq-toolbar, .vq-btn, .vq-checkbox, .vq-menu { display: none !important; }
  .vq-section { display: block !important; padding: 1cm; }
  .vq-card { box-shadow: none !important; border: 1px solid #ccc; }
  body { background: #fff; }
  .vq-genome-wrap { overflow: visible; }
}

/* ============================================================
   Responsive
   ============================================================ */

@media (max-width: 900px) {
  .vq-nav { padding: 0 var(--vq-space-4); gap: var(--vq-space-4); }
  .vq-section { padding: var(--vq-space-6) var(--vq-space-4); }
  .vq-card__body { padding: var(--vq-space-4); }
  .vq-stats-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 720px) {
  .vq-nav__tab {
    padding: 0 var(--vq-space-3);
    font-size: var(--vq-text-base);
  }
  .vq-nav__tabs { gap: 0; }
}

@media (max-width: 540px) {
  .vq-nav__meta { display: none; }
  .vq-stats-grid { grid-template-columns: 1fr; }
  .vq-section-header { flex-direction: column; align-items: flex-start; }
  .vq-section-actions { width: 100%; }
}
</style>

  <script>/* ============================================================
   export.js — shared export utilities + helpers
   Functions are pure: they receive the SVG element directly.
   Exposes everything on window.VQ so other section scripts can
   call them without relying on bare global names.
   ============================================================ */

'use strict';

// ── Small helpers ──────────────────────────────────────────────────────────

/** Escape a value for safe HTML interpolation. */
function vqEsc(v) {
  if (v == null) return '';
  return String(v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/** Replace special chars in a string before using it as a DOM id. */
function vqSafeId(s) {
  return String(s ?? '').replace(/[^A-Za-z0-9_\-]/g, '_');
}

// ── PNG export ──────────────────────────────────────────────────────────────

function vqExportPNG(svgEl, filename = 'viralquest_export.png', scale = 2) {
  if (!svgEl) return;
  const serialiser = new XMLSerializer();
  const bbox       = svgEl.getBoundingClientRect();
  const w = Math.round(bbox.width  * scale) || 800;
  const h = Math.round(bbox.height * scale) || 400;

  const clone = svgEl.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width',  w);
  clone.setAttribute('height', h);

  _applyInlineVars(clone);

  const svgStr = serialiser.serializeToString(clone);
  const blob   = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url    = URL.createObjectURL(blob);

  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width  = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    _download(canvas.toDataURL('image/png'), filename);
  };
  img.onerror = () => { URL.revokeObjectURL(url); console.error('PNG export failed'); };
  img.src = url;
}

// ── SVG export ──────────────────────────────────────────────────────────────

function vqExportSVG(svgEl, filename = 'viralquest_export.svg') {
  if (!svgEl) return;
  const clone = svgEl.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  _applyInlineVars(clone);

  const svgStr = new XMLSerializer().serializeToString(clone);
  const blob   = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  _download(URL.createObjectURL(blob), filename);
}

// ── PDF export (browser print dialog) ───────────────────────────────────────

function vqExportPDF(svgEl, title = 'ViralQuest Export') {
  if (!svgEl) return;
  const w = window.open('', '_blank', 'width=900,height=700');
  if (!w) { alert('Allow pop-ups for PDF export.'); return; }

  const clone = svgEl.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.style.cssText = 'max-width:100%;height:auto;';
  _applyInlineVars(clone);

  const styleText = `
    body { margin: 1cm; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }
    h3   { margin-bottom: 12px; font-size: 14px; color: #15314b; }
    svg  { max-width: 100%; }
  `;

  w.document.write(`
    <!DOCTYPE html>
    <html><head>
      <meta charset="UTF-8">
      <title>${vqEsc(title)}</title>
      <style>${styleText}</style>
    </head><body>
      <h3>${vqEsc(title)}</h3>
      ${new XMLSerializer().serializeToString(clone)}
      <script>window.onload = () => { window.print(); window.close(); }<\/script>
    </body></html>
  `);
  w.document.close();
}

/** Print the whole report (or a target node) via the browser's print dialog. */
function vqExportPagePDF(title = 'ViralQuest Report') {
  const prevTitle = document.title;
  document.title  = title;
  window.print();
  setTimeout(() => { document.title = prevTitle; }, 1000);
}

// ── Batch PNG export ────────────────────────────────────────────────────────

function vqExportBatchPNG(items, delay = 300) {
  return items.reduce((chain, { svgEl, filename }, i) =>
    chain.then(() => new Promise(resolve => {
      setTimeout(() => { vqExportPNG(svgEl, filename); resolve(); }, i * delay);
    })),
    Promise.resolve()
  );
}

// ── Composite export — stitch multiple SVGs into ONE file ───────────────────
// Each entry: { svgEl, label }.  We measure each SVG's intrinsic size from
// its viewBox or bounding rect and stack vertically, keeping every chart's
// horizontal proportions intact.

function _measureSvg(svg) {
  // Prefer viewBox so we preserve the original aspect ratio.
  const vb = svg.viewBox?.baseVal;
  if (vb && vb.width) return { w: vb.width, h: vb.height };
  const r = svg.getBoundingClientRect();
  return { w: r.width || 800, h: r.height || 400 };
}

/**
 * Build a single SVG that contains each input SVG as a <g> stacked vertically.
 * All inputs are scaled to a common width so proportions are preserved.
 */
function vqBuildCompositeSVG(items, opts = {}) {
  const W       = opts.width      || 1200;
  const labelH  = opts.labelHeight || 24;
  const gap     = opts.gap         || 16;
  const padding = opts.padding     || 24;

  // Plan: measure, compute scaled height per item, sum.
  const placed = items.map(it => {
    const { w, h } = _measureSvg(it.svgEl);
    const scaledH  = (W - padding * 2) * (h / w);
    return { ...it, w, h, scaledH };
  });

  const totalH = padding * 2
    + placed.reduce((a, p) => a + labelH + p.scaledH + gap, 0)
    - gap;

  const NS  = 'http://www.w3.org/2000/svg';
  const out = document.createElementNS(NS, 'svg');
  out.setAttribute('xmlns', NS);
  out.setAttribute('width',  W);
  out.setAttribute('height', totalH);
  out.setAttribute('viewBox', `0 0 ${W} ${totalH}`);

  // Inline CSS vars so colours render outside the document.
  _applyInlineVars(out);

  // Background
  const bg = document.createElementNS(NS, 'rect');
  bg.setAttribute('width',  W);
  bg.setAttribute('height', totalH);
  bg.setAttribute('fill',   '#ffffff');
  out.appendChild(bg);

  let y = padding;
  placed.forEach(p => {
    // Label
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', padding);
    t.setAttribute('y', y + labelH - 8);
    t.setAttribute('font-family', 'var(--vq-font), system-ui, sans-serif');
    t.setAttribute('font-size', '13');
    t.setAttribute('font-weight', '600');
    t.setAttribute('fill', '#15314b');
    t.textContent = p.label || '';
    out.appendChild(t);
    y += labelH;

    // Inner SVG cloned + scaled into a <g>
    const inner = p.svgEl.cloneNode(true);
    // Make sure the clone has explicit width/height equal to its intrinsic.
    inner.removeAttribute('width');
    inner.removeAttribute('height');
    inner.setAttribute('viewBox', `0 0 ${p.w} ${p.h}`);
    inner.setAttribute('preserveAspectRatio', 'xMinYMin meet');
    const scale = (W - padding * 2) / p.w;
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', `translate(${padding}, ${y}) scale(${scale})`);
    // Move all child nodes into g
    while (inner.firstChild) g.appendChild(inner.firstChild);
    out.appendChild(g);

    y += p.scaledH + gap;
  });

  return out;
}

function vqExportCompositeSVG(items, filename = 'viralquest_composite.svg', opts = {}) {
  if (!items.length) return;
  const composite = vqBuildCompositeSVG(items, opts);
  const svgStr    = new XMLSerializer().serializeToString(composite);
  const blob      = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  _download(URL.createObjectURL(blob), filename);
}

function vqExportCompositePNG(items, filename = 'viralquest_composite.png', opts = {}) {
  if (!items.length) return;
  const scale     = opts.scale || 2;
  const composite = vqBuildCompositeSVG(items, opts);
  const vb        = composite.viewBox.baseVal;
  const W         = vb.width  * scale;
  const H         = vb.height * scale;
  composite.setAttribute('width',  W);
  composite.setAttribute('height', H);

  const svgStr = new XMLSerializer().serializeToString(composite);
  const blob   = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url    = URL.createObjectURL(blob);

  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width  = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    _download(canvas.toDataURL('image/png'), filename);
  };
  img.onerror = () => { URL.revokeObjectURL(url); console.error('Composite PNG export failed'); };
  img.src = url;
}

// ── Text / FASTA download ───────────────────────────────────────────────────

function vqDownloadText(text, filename) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  _download(URL.createObjectURL(blob), filename);
}

function vqBuildFasta(seqs) {
  return seqs.map(s => {
    const body = (s.sequence_nt || '').replace(/^>.*\n/, '');
    const header = `>${s.id} ${s.taxonomy?.species || ''}`.trim();
    return body.startsWith('>') ? body : header + '\n' + body;
  }).join('\n') + '\n';
}

// ── Tooltip ─────────────────────────────────────────────────────────────────

let _tooltip = null;
function _getTooltip() {
  if (!_tooltip) _tooltip = document.getElementById('vq-tooltip');
  return _tooltip;
}

function vqTooltipShow(html, event) {
  const t = _getTooltip();
  if (!t) return;
  t.innerHTML = html;
  t.classList.add('visible');
  vqTooltipMove(event);
}

function vqTooltipMove(event) {
  const t = _getTooltip();
  if (!t || !event) return;
  const x  = event.clientX + 14;
  const y  = event.clientY + 14;
  const tw = t.offsetWidth;
  const th = t.offsetHeight;
  t.style.left = (x + tw > window.innerWidth  ? x - tw - 28 : x) + 'px';
  t.style.top  = (y + th > window.innerHeight ? y - th - 28 : y) + 'px';
}

function vqTooltipHide() {
  const t = _getTooltip();
  if (t) t.classList.remove('visible');
}

// ── Cross-section navigation (used by clusters + taxonomy) ──────────────────

function vqJumpToViewer(seqId) {
  const tab = document.querySelector('[data-section="viewer"]');
  if (tab) tab.click();
  setTimeout(() => {
    const target = document.getElementById('seq-card-' + vqSafeId(seqId));
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      target.classList.add('vq-seq-card--highlight');
      setTimeout(() => target.classList.remove('vq-seq-card--highlight'), 2000);
    }
  }, 150);
}

// ── Internal helpers ────────────────────────────────────────────────────────

/**
 * Inline computed values for CSS custom properties used by SVG export.
 * Two-pronged: (a) drop a <style> block that sets the vars on the root,
 * and (b) write each var as an inline style on the SVG root, so any
 * descendant `fill="var(--vq-…)"` style resolves when the SVG is rendered
 * standalone (inside an <img> for PNG, or saved as .svg).
 */
function _applyInlineVars(svg) {
  const style = getComputedStyle(document.documentElement);
  const vars  = [
    '--vq-primary','--vq-primary-light','--vq-accent','--vq-accent-dark',
    '--vq-accent-subtle','--vq-success','--vq-warning','--vq-danger',
    '--vq-muted','--vq-bg','--vq-surface','--vq-surface-2','--vq-border',
    '--vq-border-dark','--vq-text','--vq-text-2','--vq-text-3',
    '--vq-font','--vq-font-mono',
    '--vq-dom-1','--vq-dom-2','--vq-dom-3','--vq-dom-4',
    '--vq-dom-5','--vq-dom-6','--vq-dom-7','--vq-dom-8',
    '--vq-tax-flaviviridae','--vq-tax-parvoviridae','--vq-tax-phenuiviridae',
    '--vq-tax-nodaviridae','--vq-tax-rhabdoviridae','--vq-tax-tombusviridae',
    '--vq-tax-other',
  ];
  const inline = vars
    .map(v => `${v}:${style.getPropertyValue(v).trim()}`)
    .filter(s => !s.endsWith(':'))
    .join(';');

  const styleEl = document.createElement('style');
  styleEl.textContent = `:root{${inline}}svg{${inline}}`;
  svg.prepend(styleEl);
  // Also apply directly to <svg> as a fallback for renderers that don't
  // resolve `:root` inside an SVG document.
  const existing = svg.getAttribute('style') || '';
  svg.setAttribute('style', (existing ? existing + ';' : '') + inline);
}

function _download(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// ── Expose on window.VQ ─────────────────────────────────────────────────────

window.VQ = Object.assign(window.VQ || {}, {
  esc:          vqEsc,
  safeId:       vqSafeId,
  exportPNG:    vqExportPNG,
  exportSVG:    vqExportSVG,
  exportPDF:    vqExportPDF,
  exportPagePDF: vqExportPagePDF,
  exportBatchPNG: vqExportBatchPNG,
  exportCompositeSVG: vqExportCompositeSVG,
  exportCompositePNG: vqExportCompositePNG,
  buildCompositeSVG:  vqBuildCompositeSVG,
  downloadText: vqDownloadText,
  buildFasta:   vqBuildFasta,
  tooltipShow:  vqTooltipShow,
  tooltipMove:  vqTooltipMove,
  tooltipHide:  vqTooltipHide,
  jumpToViewer: vqJumpToViewer,
});
</script>

const _TAX_DONUT_PALETTE = [

  'var(--vq-tax-phenuiviridae)','var(--vq-tax-nodaviridae)',
  'var(--vq-tax-rhabdoviridae)','var(--vq-tax-tombusviridae)',

//  Chart 2 — Horizontal bar: HMM database hits

function _renderHMMBars(hmm) {
  const wrap = document.getElementById('stats-hmm-svg');
  if (!wrap) return;
  wrap.innerHTML = '';

  const eggnog = hmm.eggnog_hits ?? hmm.eggnong_hits ?? 0;
  const data = [
    { name: 'RVDB',   value: hmm.rvdb_hits || 0,   color: 'var(--vq-accent)'       },
    { name: 'Vfam',   value: hmm.vfam_hits || 0,   color: 'var(--vq-primary-light)' },
    { name: 'EggNOG', value: eggnog,               color: 'var(--vq-accent-dark)'  },
  ];

  const W = Math.max(wrap.clientWidth || 0, 220);
  const PAD_L = 64;
  const PAD_R = 36;
  const ROW_H = 38;
  const BAR_H = 16;
  const H = data.length * ROW_H + 16;
  const drawW = W - PAD_L - PAD_R;

  const maxV = d3.max(data, d => d.value) || 1;
  const xScale = d3.scaleLinear([0, maxV], [0, drawW]).nice();

  const svg = d3.create('svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('preserveAspectRatio', 'xMinYMin meet')
    .style('width', '100%').style('height', 'auto');

  data.forEach((d, i) => {
    const y = 8 + i * ROW_H;

    svg.append('text')
      .attr('x', PAD_L - 8).attr('y', y + BAR_H / 2 + 4)
      .attr('text-anchor', 'end')
      .attr('font-size', 12)
      .attr('font-weight', 500)
      .attr('fill', 'var(--vq-text-2)')
      .text(d.name);

    // Track
    svg.append('rect')
      .attr('x', PAD_L).attr('y', y)
      .attr('width', drawW).attr('height', BAR_H)
      .attr('rx', BAR_H / 2)
      .attr('fill', 'var(--vq-bg)');

    // Value bar
    const bw = Math.max(xScale(d.value), 4);
    svg.append('rect')
      .attr('x', PAD_L).attr('y', y)
      .attr('width', bw).attr('height', BAR_H)
      .attr('rx', BAR_H / 2)
      .attr('fill', d.color)
      .on('mousemove', evt => VQ.tooltipShow(`
        <div class="vq-tooltip__title">${VQ.esc(d.name)}</div>
        <div class="vq-tooltip__row">
          <span class="vq-tooltip__key">Hits</span><span>${d.value.toLocaleString()}</span>
        </div>`, evt))
      .on('mouseleave', VQ.tooltipHide);

    // Value text (after the bar)
    svg.append('text')
      .attr('x', PAD_L + bw + 8).attr('y', y + BAR_H / 2 + 4)
      .attr('font-size', 12)
      .attr('font-weight', 600)
      .attr('fill', 'var(--vq-text)')
      .attr('font-variant-numeric', 'tabular-nums')
      .text(d.value.toLocaleString());
  });

  wrap.appendChild(svg.node());
}

// ────────────────────────────────────────────────────────────────────────
//  Chart 3 — Salmon: mapping-rate gauge + reads breakdown
// ────────────────────────────────────────────────────────────────────────

function _renderSalmonChart(salmon) {
  const wrap = document.getElementById('stats-salmon-svg');
  if (!wrap) return;
  wrap.innerHTML = '';

  const W   = Math.max(wrap.clientWidth || 0, 240);
  const H   = 200;
  const rate = Math.max(0, Math.min(100, salmon.mapping_rate ?? 0));

  // Geometry: semicircle gauge, big number in the middle.
  const cx     = W / 2;
  const cy     = 130;
  const rOuter = 92;
  const rInner = 70;

  const arcBg = d3.arc()
    .innerRadius(rInner).outerRadius(rOuter)
    .startAngle(-Math.PI / 2).endAngle(Math.PI / 2)
    .cornerRadius(4);
  const arcVal = d3.arc()
    .innerRadius(rInner).outerRadius(rOuter)
    .startAngle(-Math.PI / 2)
    .endAngle(-Math.PI / 2 + (rate / 100) * Math.PI)
    .cornerRadius(4);

  const svg = d3.create('svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('preserveAspectRatio', 'xMidYMin meet')
    .style('width', '100%').style('height', 'auto');

  const g = svg.append('g').attr('transform', `translate(${cx}, ${cy})`);

  g.append('path').attr('d', arcBg()).attr('fill', 'var(--vq-bg)');

  const rateColor = rate >= 30 ? 'var(--vq-success)'
                  : rate >= 15 ? 'var(--vq-accent)'
                              : 'var(--vq-warning)';
  g.append('path').attr('d', arcVal()).attr('fill', rateColor)
    .on('mousemove', evt => VQ.tooltipShow(`
      <div class="vq-tooltip__title">Mapping rate</div>
      <div class="vq-tooltip__row">
        <span class="vq-tooltip__key">Reads aligned</span><span>${rate.toFixed(1)}%</span>
      </div>`, evt))
    .on('mouseleave', VQ.tooltipHide);

  // Inner number
  g.append('text')
    .attr('text-anchor', 'middle')
    .attr('font-size', 28)
    .attr('font-weight', 700)
    .attr('letter-spacing', '-0.02em')
    .attr('fill', 'var(--vq-primary)')
    .attr('y', -10)
    .text(rate.toFixed(1) + '%');
  g.append('text')
    .attr('text-anchor', 'middle')
    .attr('font-size', 10)
    .attr('fill', 'var(--vq-text-3)')
    .attr('y', 8)
    .text('mapping rate');

  // Gauge end labels (0 / 100)
  svg.append('text').attr('x', cx - rOuter - 4).attr('y', cy + 12)
    .attr('text-anchor', 'end').attr('font-size', 10).attr('fill', 'var(--vq-text-3)').text('0');
  svg.append('text').attr('x', cx + rOuter + 4).attr('y', cy + 12)
    .attr('font-size', 10).attr('fill', 'var(--vq-text-3)').text('100%');

  // Bottom strip — reads / host-viral hits
  const tot  = salmon.total_reads     || 0;
  const host = salmon.host_viral_hits || 0;

  svg.append('text').attr('x', cx).attr('y', cy + 36)
    .attr('text-anchor', 'middle')
    .attr('font-size', 11)
    .attr('fill', 'var(--vq-text-2)')
    .text(`${tot.toLocaleString()} reads · ${host} host–viral hits`);

  wrap.appendChild(svg.node());
}

function _renderSalmonEmpty() {
  const wrap = document.getElementById('stats-salmon-svg');
  if (wrap) wrap.innerHTML =
    '<div class="vq-empty" style="padding:40px 16px;font-size:12px">No Salmon quantification data.</div>';
}

window.vqInitStats = vqInitStats;
})();
</script>

(function () {
'use strict';

/* ============================================================
   section_clusters.js — Section 2: Cluster Analysis
   Linear alignment view: members drawn relative to representative.
   Colour encodes % identity. Click member → jump to viewer.
   ============================================================ */

function vqInitClusters(clusters) {
  const el = document.getElementById('section-clusters');
  if (!el) return;
  if (!clusters.length) {
    el.innerHTML = '<div class="vq-empty">No clusters found.</div>';
    return;
  }

  const esc = VQ.esc;

  el.innerHTML = `
    <div class="vq-section-header">
      <div>
        <div class="vq-section-title">Cluster Analysis</div>
        <div class="vq-section-sub">
          ${clusters.length} cluster${clusters.length > 1 ? 's' : ''} ·
          members shown as alignments to representative sequence
        </div>
      </div>
      <div class="vq-section-actions">
        ${_identityLegend()}
      </div>
    </div>
    <div id="clusters-list"></div>
  `;

  const list = document.getElementById('clusters-list');
  clusters.forEach(c => list.appendChild(_renderCluster(c)));
}

// ── Render one cluster card ────────────────────────────────────────────────

function _renderCluster(cluster) {
  const esc   = VQ.esc;
  const safe  = VQ.safeId(cluster.cluster_id);
  const card  = document.createElement('div');
  card.className = 'vq-card';
  card.style.marginBottom = 'var(--vq-space-4)';

  const rep    = cluster.members.find(m => m.is_representative) || cluster.members[0];
  const repLen = rep?.length || 1;

  card.innerHTML = `
    <div class="vq-card__header">
      <div class="vq-card__title">
        <span class="vq-badge vq-badge--cluster">${esc(cluster.cluster_id)}</span>
        ${esc(cluster.species)}
      </div>
      <div class="vq-section-actions">
        <span style="font-size:var(--vq-text-xs);color:var(--vq-text-3)">
          ${cluster.size} member${cluster.size > 1 ? 's' : ''}
        </span>
        ${_exportMenu('clu-menu-' + safe)}
      </div>
    </div>
    <div class="vq-card__body">
      <div class="vq-genome-wrap" id="clu-wrap-${safe}"></div>
    </div>`;

  // Render SVG once the wrap actually has a real width (it's 0 while the
  // section is still display:none on init), and re-render on any width change.
  let lastW = 0;
  let rzTimer = null;
  const wrapEl = card.querySelector('#clu-wrap-' + safe);
  _wireExportMenu(card, 'clu-menu-' + safe, () => card.querySelector('svg'),
                  `cluster_${cluster.cluster_id}`);

  const render = () => {
    const w = wrapEl.clientWidth;
    if (!w || w === lastW) return;
    lastW = w;
    wrapEl.innerHTML = '';
    wrapEl.appendChild(_clusterSVG(cluster, repLen, w));
  };

  const ro = new ResizeObserver(() => {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(render, 60);
  });
  ro.observe(wrapEl);
  // Best-effort first paint (no-op when hidden; ResizeObserver covers reveal)
  requestAnimationFrame(render);

  return card;
}

// ── Reusable export dropdown ────────────────────────────────────────────────

function _exportMenu(id) {
  return `
    <div class="vq-menu" id="${id}">
      <button class="vq-btn vq-btn--sm vq-btn--ghost" data-menu-toggle type="button">
        Export
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="vq-menu__panel" role="menu">
        <button class="vq-menu__item" data-fmt="png" role="menuitem" type="button">PNG image</button>
        <button class="vq-menu__item" data-fmt="svg" role="menuitem" type="button">SVG vector</button>
        <button class="vq-menu__item" data-fmt="pdf" role="menuitem" type="button">PDF (print)</button>
      </div>
    </div>`;
}

function _wireExportMenu(root, menuId, getSvg, baseName) {
  const menu   = root.querySelector('#' + menuId);
  if (!menu) return;
  const toggle = menu.querySelector('[data-menu-toggle]');
  toggle?.addEventListener('click', e => {
    e.stopPropagation();
    // Close any other open menus
    document.querySelectorAll('.vq-menu.open').forEach(m => {
      if (m !== menu) m.classList.remove('open');
    });
    menu.classList.toggle('open');
  });
  menu.querySelectorAll('[data-fmt]').forEach(item => {
    item.addEventListener('click', e => {
      e.stopPropagation();
      menu.classList.remove('open');
      const svg = getSvg();
      const fmt = item.dataset.fmt;
      if (!svg) return;
      if (fmt === 'png') VQ.exportPNG(svg, baseName + '.png');
      if (fmt === 'svg') VQ.exportSVG(svg, baseName + '.svg');
      if (fmt === 'pdf') VQ.exportPDF(svg, baseName);
    });
  });
}

// Global click closes any open menu
document.addEventListener('click', () => {
  document.querySelectorAll('.vq-menu.open').forEach(m => m.classList.remove('open'));
});

// ── Build the cluster SVG ───────────────────────────────────────────────────

function _clusterSVG(cluster, repLen, containerWidth) {
  const PAD_L = 170;
  const PAD_R = 20;
  const ROW_H = 28;
  const GAP   = 6;
  const TRACK = 14;

  const totalH = cluster.members.length * (ROW_H + GAP) + 40;
  const W      = Math.max(containerWidth || 0, 720);
  const drawW  = W - PAD_L - PAD_R;

  const svg = d3.create('svg')
    .attr('class', 'vq-genome-svg vq-genome-svg--fluid')
    .attr('viewBox', `0 0 ${W} ${totalH}`)
    .attr('preserveAspectRatio', 'xMinYMin meet')
    .style('width',  '100%')
    .style('height', 'auto')
    .attr('height',  totalH);

  const xScale = d3.scaleLinear([0, repLen], [0, drawW]);

  // --- axis (gridlines extend DOWN into the chart) ---
  const axisG = svg.append('g')
    .attr('transform', `translate(${PAD_L}, 20)`)
    .call(d3.axisTop(xScale).ticks(8).tickSize(-(totalH - 30)));

  axisG.select('.domain').remove();
  axisG.selectAll('.tick line')
    .attr('stroke', '#dde3ec').attr('stroke-dasharray', '3,3');
  axisG.selectAll('.tick text')
    .style('font-size', '10px').style('fill', '#94a3b8');

  // --- members ---
  cluster.members.forEach((m, i) => {
    const y   = 30 + i * (ROW_H + GAP);
    const col = _identityColor(m.identity);
    const g   = svg.append('g').attr('transform', `translate(${PAD_L}, ${y})`);

    // Label — appended to the row group, not the root svg, for consistency.
    const labelText = m.seq_id;
    const truncated = labelText.length > 18 ? labelText.slice(0, 17) + '…' : labelText;
    const label = g.append('text')
      .attr('x', -8)
      .attr('y', TRACK / 2 + 4)
      .attr('text-anchor', 'end')
      .attr('font-size', 11)
      .attr('fill', m.is_representative ? 'var(--vq-primary)' : 'var(--vq-text-2)')
      .attr('font-weight', m.is_representative ? '600' : '400')
      .attr('font-family', 'var(--vq-font-mono)')
      .text(truncated);

    if (truncated !== labelText) {
      label.style('cursor', 'help')
        .on('mousemove', evt => VQ.tooltipShow(
          `<div class="vq-tooltip__title">${VQ.esc(labelText)}</div>`, evt))
        .on('mouseleave', VQ.tooltipHide);
    }

    // Backbone
    g.append('rect')
      .attr('x', 0).attr('y', TRACK / 2 - 1)
      .attr('width', drawW).attr('height', 2)
      .attr('rx', 1)
      .attr('fill', '#dde3ec');

    // Alignment bar
    const x1 = xScale(m.aln_start - 1);
    const x2 = xScale(m.aln_end);
    const bw = Math.max(x2 - x1, 2);

    g.append('rect')
      .attr('x', x1).attr('width', bw)
      .attr('y', 0).attr('height', TRACK)
      .attr('rx', 3)
      .attr('fill', col)
      .attr('opacity', m.is_representative ? 1 : 0.85)
      .attr('cursor', 'pointer')
      .on('mousemove', evt => VQ.tooltipShow(`
        <div class="vq-tooltip__title">${VQ.esc(m.seq_id)}</div>
        <div class="vq-tooltip__row">
          <span class="vq-tooltip__key">Identity</span><span>${m.identity.toFixed(1)}%</span>
          <span class="vq-tooltip__key">Coverage</span><span>${m.query_coverage.toFixed(1)}%</span>
          <span class="vq-tooltip__key">Length</span><span>${m.length.toLocaleString()} nt</span>
          <span class="vq-tooltip__key">Aln range</span><span>${m.aln_start}–${m.aln_end}</span>
        </div>`, evt))
      .on('mouseleave', VQ.tooltipHide)
      .on('click', () => VQ.jumpToViewer(m.seq_id));

    // In-bar label
    if (m.is_representative) {
      g.append('text')
        .attr('x', x1 + bw / 2)
        .attr('y', TRACK / 2 + 4)
        .attr('text-anchor', 'middle')
        .attr('font-size', 10)
        .attr('fill', 'rgba(255,255,255,.95)')
        .attr('pointer-events', 'none')
        .text('representative · ' + m.length.toLocaleString() + ' nt');
    } else if (bw > 50) {
      g.append('text')
        .attr('x', x1 + bw / 2)
        .attr('y', TRACK / 2 + 4)
        .attr('text-anchor', 'middle')
        .attr('font-size', 10)
        .attr('fill', 'rgba(255,255,255,.9)')
        .attr('pointer-events', 'none')
        .text(m.identity.toFixed(0) + '%');
    }
  });

  return svg.node();
}

// ── Colour scale (RdYlGn) ──────────────────────────────────────────────────

function _identityColor(pct) {
  const t = Math.max(0, Math.min(1, pct / 100));
  return d3.interpolateRdYlGn(t);
}

// ── Continuous gradient legend ─────────────────────────────────────────────

function _identityLegend() {
  return `
    <div class="vq-gradient-legend" title="Alignment identity (%)">
      <span>% identity</span>
      <div>
        <div class="vq-gradient-legend__bar"></div>
        <div class="vq-gradient-legend__ticks">
          <span>0</span><span>50</span><span>100</span>
        </div>
      </div>
    </div>`;
}


window.vqInitClusters = vqInitClusters;
})();
</script>
