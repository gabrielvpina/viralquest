          ${families.map(f => `<option value="${esc(f)}">${esc(f)}</option>`).join('')}
        </select>
        <select class="vq-select" id="viewer-genus" aria-label="Filter by genus">
          <option value="">All genera</option>
          ${genera.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('')}
        </select>
        <select class="vq-select" id="viewer-score" aria-label="Filter by VQ score">
          <option value="">Any VQ score</option>
          <option value="80">VQ ≥ 80</option>
          <option value="60">VQ ≥ 60</option>
          <option value="40">VQ ≥ 40</option>
        </select>
        <select class="vq-select" id="viewer-classification" aria-label="Filter by classification">
          <option value="">Any classification</option>
          <option value="viral-known">Viral known</option>
          <option value="viral-unknown">Viral unknown</option>
          <option value="non-viral">Non-viral</option>
        </select>
      </div>
    </div>

    <div id="viewer-list"></div>
  `;

  ['viewer-search','viewer-phylum','viewer-family','viewer-genus','viewer-score','viewer-classification']
    .forEach(id => document.getElementById(id)?.addEventListener('input', _applyFilters));

  document.getElementById('viewer-select-all')?.addEventListener('click', () => {
    _VW.filtered.forEach(s => _VW.selected.add(s.id));
    _renderList(); _updateBatchBtn();
  });
  document.getElementById('viewer-deselect')?.addEventListener('click', () => {
    _VW.selected.clear();
    _renderList(); _updateBatchBtn();
  });
  document.getElementById('viewer-expand-all')?.addEventListener('click', () => {
    document.querySelectorAll('.vq-seq-card').forEach(c => _openCard(c));
  });
  document.getElementById('viewer-collapse-all')?.addEventListener('click', () => {
    document.querySelectorAll('.vq-seq-card.open').forEach(c => {
      c.classList.remove('open');
      c.querySelector('.vq-seq-card__head')?.setAttribute('aria-expanded', 'false');
    });
  });

  const batchMenu = document.getElementById('viewer-batch-menu');
  const batchBtn  = document.getElementById('viewer-batch-btn');
  batchBtn?.addEventListener('click', e => {
    if (batchBtn.disabled) return;
    e.stopPropagation();
    document.querySelectorAll('.vq-menu.open').forEach(m => {
      if (m !== batchMenu) m.classList.remove('open');
    });
    batchMenu.classList.toggle('open');
  });
  batchMenu?.querySelectorAll('[data-batch]').forEach(item => {
    item.addEventListener('click', e => {
      e.stopPropagation();
      batchMenu.classList.remove('open');
      _runBatch(item.dataset.batch);
    });
  });

  _renderList();
}

// ── Filtering ──────────────────────────────────────────────────────────────

function _applyFilters() {
  const q       = document.getElementById('viewer-search')?.value.toLowerCase() || '';
  const phylum  = document.getElementById('viewer-phylum')?.value || '';
  const family  = document.getElementById('viewer-family')?.value || '';
  const genus   = document.getElementById('viewer-genus')?.value  || '';
  const cls     = document.getElementById('viewer-classification')?.value || '';
  const minScore = parseInt(document.getElementById('viewer-score')?.value || '0', 10);

  _VW.filtered = _VW.sequences.filter(s => {
    if (q && !s.id.toLowerCase().includes(q) &&
        !(s.taxonomy?.species || '').toLowerCase().includes(q)) return false;
    if (phylum && s.taxonomy?.phylum !== phylum) return false;
    if (family && s.taxonomy?.family !== family) return false;
    if (genus  && s.taxonomy?.genus  !== genus)  return false;
    if (cls    && s.llm_output?.classification !== cls) return false;
    if (minScore && (s.llm_output?.vq_score ?? 0) < minScore) return false;
    return true;
  });

  const countEl = document.getElementById('viewer-count');
  if (countEl) countEl.textContent =
    `${_VW.filtered.length} of ${_VW.sequences.length} sequence${_VW.sequences.length !== 1 ? 's' : ''}`;

  _renderList();
}

// ── List rendering ─────────────────────────────────────────────────────────

function _renderList() {
  const list = document.getElementById('viewer-list');
  if (!list) return;
  list.innerHTML = '';

  if (!_VW.filtered.length) {
    list.innerHTML = '<div class="vq-empty">No sequences match the current filters.</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  _VW.filtered.forEach(seq => frag.appendChild(_seqCard(seq)));
  list.appendChild(frag);
}

// ── Sequence card ──────────────────────────────────────────────────────────

function _seqCard(seq) {
  const esc  = VQ.esc;
  const safe = VQ.safeId(seq.id);
  const card = document.createElement('div');
  card.className = 'vq-seq-card';
  card.id        = 'seq-card-' + safe;
  card.dataset.seqId = seq.id;
  card.style.marginBottom = '6px';

  const llm = seq.llm_output;
  const tax = seq.taxonomy;
  const cls = llm?.classification || 'non-viral';

  const orfCount     = (seq.orfs || []).length;
  const blastnCount  = (seq.blastn_hits || []).length;
  const refseqCount  = (seq.blastx_hits || []).length;
  const nrCount      = (seq.blastx_nr_hits || []).length;

  card.innerHTML = `
    <div class="vq-seq-card__head" role="button" tabindex="0" aria-expanded="false">
      <input type="checkbox" class="vq-checkbox" data-seq-checkbox
             ${_VW.selected.has(seq.id) ? 'checked' : ''}
             aria-label="Select ${esc(seq.id)}">
      <span class="vq-seq-card__id">${esc(seq.id)}</span>
      <div class="vq-seq-card__meta">
        ${tax?.family ? `
          <span class="vq-seq-card__meta-item">
            <span class="vq-seq-card__meta-label">Family</span>${esc(tax.family)}
          </span>` : ''}
        ${tax?.genus ? `
          <span class="vq-seq-card__meta-item">
            <span class="vq-seq-card__meta-label">Genus</span>${esc(tax.genus)}
          </span>` : ''}
        <span class="vq-seq-card__meta-item">
          ${(seq.length || 0).toLocaleString()} nt
        </span>
        <span class="vq-seq-card__meta-item">
          GC ${seq.gc_content != null ? seq.gc_content.toFixed(1) : '—'}%
        </span>
        <span class="vq-seq-card__meta-item">
          ${orfCount} ORF${orfCount !== 1 ? 's' : ''}
        </span>
        ${seq.cluster_id ? `<span class="vq-badge vq-badge--cluster">${esc(seq.cluster_id)}</span>` : ''}
        ${llm ? `<span class="vq-badge vq-badge--${esc(cls)}">${esc(cls)} · ${llm.vq_score}</span>` : ''}
      </div>
      <div class="vq-section-actions" style="margin-left:auto;">
        ${_seqExportMenu(safe)}
      </div>
      <svg class="vq-seq-card__chevron" width="14" height="14" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </div>

    <div class="vq-seq-card__body" id="body-${safe}">

      <div class="vq-body-label">Genome map</div>
      <div class="vq-genome-wrap" id="genome-wrap-${safe}"></div>

      <div class="vq-body-label">BLAST hits</div>
      <div class="vq-panel">
        <div class="vq-subtabs" role="tablist" aria-label="BLAST hit sources">
          <button class="vq-subtab active" type="button" data-blast="blastn" role="tab">
            BLASTn<span class="vq-subtab__count">${blastnCount}</span>
          </button>
          <button class="vq-subtab" type="button" data-blast="refseq" role="tab">
            BLASTx · RefSeq<span class="vq-subtab__count">${refseqCount}</span>
          </button>
          <button class="vq-subtab" type="button" data-blast="nr" role="tab">
            BLASTx · NR<span class="vq-subtab__count">${nrCount}</span>
          </button>
        </div>
        <div class="vq-panel__body" id="blast-body-${safe}"></div>
      </div>

      ${llm?.analysis ? `
        <div class="vq-body-label">LLM analysis</div>
        <div style="font-size:12.5px;color:var(--vq-text-2);line-height:1.55;
                    background:var(--vq-surface-2);border:1px solid var(--vq-border);
                    border-radius:var(--vq-radius-sm);padding:10px 12px">
          <div style="font-size:11px;color:var(--vq-text-3);margin-bottom:4px">
            ${esc(llm.classification)} · score ${llm.vq_score}
          </div>
          ${esc(llm.analysis)}
        </div>` : ''}

      ${seq.sequence_nt ? `
        <div class="vq-body-label">FASTA preview</div>
        <div class="vq-fasta">${esc(seq.sequence_nt)}</div>` : ''}

    </div>`;

  // Checkbox
  card.querySelector('[data-seq-checkbox]')?.addEventListener('change', e => {
    if (e.target.checked) _VW.selected.add(seq.id);
    else                  _VW.selected.delete(seq.id);
    _updateBatchBtn();
  });

  // Export menu wiring
  _wireExportMenu(card, 'seq-menu-' + safe, () => card.querySelector('.vq-genome-wrap svg'), seq);

  // BLAST subtabs (lazy-render hit tables)
  const subtabs   = card.querySelectorAll('.vq-subtab');
  const blastBody = card.querySelector('#blast-body-' + safe);
  const renderBlast = (kind) => {
    let hits = [];
    if      (kind === 'blastn') hits = seq.blastn_hits        || [];
    else if (kind === 'refseq') hits = seq.blastx_hits || [];
    else                        hits = seq.blastx_nr_hits     || [];
    blastBody.innerHTML = _blastTable(hits, kind);
  };
  subtabs.forEach(t => t.addEventListener('click', () => {
    subtabs.forEach(s => s.classList.toggle('active', s === t));
    renderBlast(t.dataset.blast);
  }));

  // Expand / collapse
  const head = card.querySelector('.vq-seq-card__head');
  head.addEventListener('click', e => {
    if (e.target.closest('button') || e.target.closest('input') ||
        e.target.closest('.vq-menu')) return;
    _toggleCard(card, seq);
  });
  head.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); _toggleCard(card, seq); }
  });

  return card;
}

function _openCard(card) {
  if (card.classList.contains('open')) return;
  const id  = card.dataset.seqId;
  const seq = _VW.sequences.find(s => s.id === id);
  if (seq) _toggleCard(card, seq, /*forceOpen*/ true);
}

function _toggleCard(card, seq, forceOpen = false) {
  const isOpen = forceOpen ? true : !card.classList.contains('open');
  card.classList.toggle('open', isOpen);
  card.querySelector('.vq-seq-card__head')?.setAttribute('aria-expanded', String(isOpen));
  if (!isOpen) return;

  const safe = VQ.safeId(seq.id);
  const wrap = card.querySelector('#genome-wrap-' + safe);
  if (wrap && !wrap.querySelector('svg')) wrap.appendChild(_genomeSVG(seq, wrap.clientWidth));

  // Render the default BLASTn table
  const blastBody = card.querySelector('#blast-body-' + safe);
  if (blastBody && !blastBody.innerHTML) {
    blastBody.innerHTML = _blastTable(seq.blastn_hits || [], 'blastn');
  }
}

// ── BLAST hits table ────────────────────────────────────────────────────────

function _blastTable(hits, kind) {
  if (!hits.length) {
    return `<div class="vq-empty" style="padding:24px 16px">No ${kind} hits.</div>`;
  }
  const esc = VQ.esc;
  const rows = hits.map(h => {
    const accession = h.subject_id || '—';
    const title     = h.subject_title || h.stitle || '—';
    const pident    = h.pct_identity ?? h.pident;
    const qcov      = h.query_coverage ?? h.qcovhsp;
    const evalue    = h.e_value ?? h.evalue;
    const bitscore  = h.bit_score ?? h.bitscore;
    const qrange    = (h.query_start != null && h.query_end != null)
      ? `${h.query_start}–${h.query_end}`
      : '—';
    return `
    <tr>
      <td class="vq-td--mono">${esc(accession)}</td>
      <td>${esc(title)}</td>
      <td class="vq-td--num">${pident != null ? pident.toFixed(1) + '%' : '—'}</td>
      <td class="vq-td--num">${qcov != null ? (+qcov).toFixed(1) + '%' : '—'}</td>
      <td class="vq-td--num">${evalue != null ? evalue.toExponential(1) : '—'}</td>
      <td class="vq-td--num">${bitscore ?? '—'}</td>
      <td class="vq-td--num">${qrange}</td>
    </tr>`;
  }).join('');
  return `
    <table class="vq-table">
      <thead>
        <tr>
          <th>Accession</th><th>Title</th><th>Identity</th>
          <th>Coverage</th><th>E-value</th><th>Bit score</th><th>Query range</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Per-card export menu ───────────────────────────────────────────────────

function _seqExportMenu(safeId) {
  return `
    <div class="vq-menu" id="seq-menu-${safeId}">
      <button class="vq-btn vq-btn--sm vq-btn--ghost" data-menu-toggle type="button"
              aria-label="Export options">
        Export
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="vq-menu__panel" role="menu">
        <button class="vq-menu__item" data-fmt="png" role="menuitem" type="button">PNG image</button>
        <button class="vq-menu__item" data-fmt="svg" role="menuitem" type="button">SVG vector</button>
        <button class="vq-menu__item" data-fmt="pdf" role="menuitem" type="button">PDF (print)</button>
        <button class="vq-menu__item" data-fmt="fasta" role="menuitem" type="button">FASTA sequence</button>
      </div>
    </div>`;
}

function _wireExportMenu(card, menuId, getSvg, seq) {
  const menu = card.querySelector('#' + menuId);
  if (!menu) return;
  const toggle = menu.querySelector('[data-menu-toggle]');
  toggle?.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.vq-menu.open').forEach(m => {
      if (m !== menu) m.classList.remove('open');
    });
    menu.classList.toggle('open');
  });
  menu.querySelectorAll('[data-fmt]').forEach(item => {
    item.addEventListener('click', e => {
      e.stopPropagation();
      menu.classList.remove('open');
      const fmt = item.dataset.fmt;
      if (fmt === 'fasta') {
        VQ.downloadText(VQ.buildFasta([seq]), `${seq.id}.fasta`);
        return;
      }
      // Make sure the card is open & the SVG rendered
      _openCard(card);
      const svg = getSvg();
      if (!svg) return;
      if (fmt === 'png') VQ.exportPNG(svg, seq.id + '.png');
      if (fmt === 'svg') VQ.exportSVG(svg, seq.id + '.svg');
      if (fmt === 'pdf') VQ.exportPDF(svg, seq.id);
    });
  });
}

// ── Batch ──────────────────────────────────────────────────────────────────

function _updateBatchBtn() {
  const n     = _VW.selected.size;
  const btn   = document.getElementById('viewer-batch-btn');
  const label = document.getElementById('viewer-batch-label');
  if (!btn) return;
  btn.disabled = n === 0;
  if (label) label.textContent = n ? `Export ${n} selected` : 'Export selected';
}

function _ensureSvgForSeq(seqId) {
  const safe = VQ.safeId(seqId);
  const card = document.getElementById('seq-card-' + safe);
  if (!card) return null;
  _openCard(card);
  return card.querySelector('.vq-genome-wrap svg');
}

function _selectedSeqs() {
  return [..._VW.selected].map(id => _VW.sequences.find(s => s.id === id)).filter(Boolean);
}

async function _runBatch(kind) {
  const seqs = _selectedSeqs();
  if (!seqs.length) return;

  if (kind === 'fasta') {
    VQ.downloadText(VQ.buildFasta(seqs), `viralquest_selected_${seqs.length}.fasta`);
    return;
  }

  // Make sure every selected sequence has its SVG built
  const items = seqs.map(s => ({
    svgEl: _ensureSvgForSeq(s.id),
    label: `${s.id}  ·  ${s.taxonomy?.species || ''}  ·  ${(s.length||0).toLocaleString()} nt`,
    filename: s.id,
  })).filter(it => it.svgEl);

  if (!items.length) return;

  if (kind === 'png') {
    VQ.exportCompositePNG(items, `viralquest_${items.length}_sequences.png`);
  } else if (kind === 'svg') {
    VQ.exportCompositeSVG(items, `viralquest_${items.length}_sequences.svg`);
  } else if (kind === 'png-each') {
    await VQ.exportBatchPNG(items.map(it => ({ svgEl: it.svgEl, filename: it.filename + '.png' })), 350);
  } else if (kind === 'svg-each') {
    for (const it of items) { VQ.exportSVG(it.svgEl, it.filename + '.svg'); await _sleep(180); }
  }
}

const _sleep = ms => new Promise(r => setTimeout(r, ms));

// ── Genome SVG ────────────────────────────────────────────────────────────────

function _genomeSVG(seq, containerWidth) {
  const orfs   = seq.orfs || [];
  const seqLen = seq.length || 1;

  const PAD_L = 50;   // wider left gutter for frame labels
  const PAD_R = 24;

  // Long genomes get more horizontal pixels so the bars stay readable and
  // the wrap scrolls horizontally (CSS: overflow-x:auto on .vq-genome-wrap).
  const SCROLL_THRESHOLD = 20000;
  const containerW = Math.max(containerWidth || 0, 720);
  const fluidMode  = seqLen <= SCROLL_THRESHOLD;
  const W = fluidMode
    ? containerW
    : Math.max(containerW, Math.round(seqLen / 10));   // ~10 nt per pixel

  const drawW = W - PAD_L - PAD_R;
  const SCALE = d3.scaleLinear([0, seqLen], [0, drawW]);

  // ── Frame-based lane assignment ─────────────────────────────────────────
  const FRAME_INDEX = { '+1': 0, '+2': 1, '+3': 2, '-1': 3, '-2': 4, '-3': 5 };
  const FRAME_LABEL = ['+1','+2','+3','-1','-2','-3'];

  function frameLane(orf) {
    const f = orf.frame;
    // frame may be a number (2, -2) or already a string ('+2', '-2')
    const key = typeof f === 'number'
      ? (f > 0 ? '+' : '') + f
      : String(f ?? '').replace(/\s+/g, '');
    return FRAME_INDEX[key] ?? (orf.strand === '-' ? 3 : 0);
  }
  const nLanes = 6;

  // Pack domains into sub-lanes per ORF
  const orfsWithFrame = orfs.map(o => ({
    ...o,
    frameLane:    frameLane(o),
    _domainLanes: _assignDomainLanes(o.domains || []),
  }));
  orfsWithFrame.forEach(o => {
    o._nDomLanes = Math.max(0, ...o._domainLanes.map(d => d.lane + 1));
  });

  const AXIS_Y = 28;
  const ORF_H  = 16;
  const DOM_H  = 7;
  const DOM_G  = 1.5;
  const LANE_G = 12;
  const STRAND_GAP = 14;   // gap between + and - frame groups

  // Each lane: enough vertical room for the ORF bar + its domain stack.
  const laneDomMax = new Array(nLanes).fill(0);
  orfsWithFrame.forEach(o => {
    if (o._nDomLanes > laneDomMax[o.frameLane]) laneDomMax[o.frameLane] = o._nDomLanes;
  });
  const laneHeights = laneDomMax.map(n => ORF_H + n * (DOM_H + DOM_G) + LANE_G);
  const laneYs      = [];
  let cy = AXIS_Y + 14;
  laneHeights.forEach((h, i) => {
    laneYs.push(cy);
    cy += h;
    if (i === 2) cy += STRAND_GAP;   // separator between + and - strand frames
  });

  const totalH = cy + 36;

  const svg = d3.create('svg')
    .attr('class', 'vq-genome-svg' + (fluidMode ? ' vq-genome-svg--fluid' : ''))
    .attr('viewBox', `0 0 ${W} ${totalH}`)
    .attr('preserveAspectRatio', 'xMinYMin meet');
  if (fluidMode) {
    svg.style('width', '100%').style('height', 'auto');
  } else {
    svg.attr('width', W).attr('height', totalH).style('min-width', W + 'px');
  }

  // ── Axis ────────────────────────────────────────────────────────────────
  const gridH = totalH - AXIS_Y - 26;
  const axisG = svg.append('g')
    .attr('transform', `translate(${PAD_L}, ${AXIS_Y})`)
    .call(d3.axisTop(SCALE).ticks(Math.min(14, Math.max(4, Math.round(W / 120)))).tickSize(0));
  axisG.selectAll('.tick line')
    .attr('y1', 0).attr('y2', gridH)
    .attr('stroke', 'var(--vq-border)').attr('stroke-dasharray', '3,3');
  axisG.select('.domain').attr('stroke', 'var(--vq-border-dark)');
  axisG.selectAll('.tick text')
    .style('font-size', '9.5px').style('fill', 'var(--vq-text-3)');

  // ── Frame labels (left gutter) + lane backgrounds ───────────────────────
  laneYs.forEach((y, i) => {
    // Subtle striping so the lanes are visually distinct
    svg.append('rect')
      .attr('x', PAD_L).attr('y', y - 2)
      .attr('width', drawW)
      .attr('height', ORF_H + laneDomMax[i] * (DOM_H + DOM_G) + 4)
      .attr('fill', i % 2 ? 'var(--vq-surface-2)' : 'transparent')
      .attr('opacity', 0.5);

    svg.append('text')
      .attr('x', PAD_L - 8)
      .attr('y', y + ORF_H / 2 + 4)
      .attr('text-anchor', 'end')
      .attr('font-size', 10)
      .attr('font-family', 'var(--vq-font-mono)')
      .attr('fill', i < 3 ? 'var(--vq-accent-dark)' : 'var(--vq-warning)')
      .text(FRAME_LABEL[i]);
  });

  // Backbone for + strand and - strand (between frame groups)
  const plusBackboneY  = laneYs[2] + ORF_H + laneDomMax[2] * (DOM_H + DOM_G) + 6;
  svg.append('line')
    .attr('x1', PAD_L).attr('x2', PAD_L + drawW)
    .attr('y1', plusBackboneY).attr('y2', plusBackboneY)
    .attr('stroke', 'var(--vq-border-dark)').attr('stroke-width', 1.5)
    .attr('stroke-dasharray', '2,3');

  // ── ORFs ────────────────────────────────────────────────────────────────
  orfsWithFrame.forEach(orf => {
    const x1  = PAD_L + SCALE(orf.start_position);
    const x2  = PAD_L + SCALE(orf.stop_position);
    const bw  = Math.max(x2 - x1, 4);
    const y   = laneYs[orf.frameLane];
    const col = orf.strand === '-' ? 'var(--vq-warning)' : 'var(--vq-accent)';

    const g = svg.append('g');

    // Build tooltip with AA sequence preview if available
    const aa = orf.aa_sequence || '';
    const aaPreview = aa.length > 60 ? aa.slice(0, 60) + '…' : aa;
    const aaRow = aa
      ? `<div style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.12)">
           <div class="vq-tooltip__key" style="margin-bottom:3px">Sequence (${aa.length} aa)</div>
           <div style="font-family:var(--vq-font-mono);font-size:10px;word-break:break-all;
                       max-width:240px;color:rgba(255,255,255,.92)">${VQ.esc(aaPreview)}</div>
         </div>`
      : '';

    g.append('rect')
      .attr('x', x1).attr('width', bw)
      .attr('y', y).attr('height', ORF_H)
      .attr('rx', 3)
      .attr('fill', col).attr('opacity', .88)
      .on('mousemove', evt => VQ.tooltipShow(`
        <div class="vq-tooltip__title">${VQ.esc(orf.name)}</div>
        <div class="vq-tooltip__row">
          <span class="vq-tooltip__key">Strand</span><span>${VQ.esc(orf.strand)}</span>
          <span class="vq-tooltip__key">Frame</span><span>${VQ.esc(orf.frame)}</span>
          <span class="vq-tooltip__key">Length</span><span>${orf.length_aa} aa</span>
          <span class="vq-tooltip__key">Position</span>
          <span>${orf.start_position}–${orf.stop_position}</span>
          <span class="vq-tooltip__key">Type</span><span>${VQ.esc(orf.orf_type)}</span>
          <span class="vq-tooltip__key">Domains</span><span>${(orf.domains||[]).length}</span>
        </div>
        ${aaRow}`, evt))
      .on('mouseleave', VQ.tooltipHide);

    if (bw > 38) {
      g.append('text')
        .attr('x', x1 + bw / 2).attr('y', y + ORF_H / 2 + 3.5)
        .attr('text-anchor', 'middle')
        .attr('font-size', 9.5)
        .attr('fill', 'rgba(255,255,255,.92)')
        .attr('pointer-events', 'none')
        .text((orf.strand === '+' ? '▶ ' : '◀ ') + orf.name);
    }

    // HMM domains — lane-packed below the ORF bar within the same frame lane
    (orf._domainLanes || []).forEach(d => {
      const domStart = orf.start_position + d.dom.start * 3;
      const domEnd   = orf.start_position + d.dom.stop  * 3;
      const dx1      = PAD_L + SCALE(Math.min(domStart, domEnd));
      const dx2      = PAD_L + SCALE(Math.max(domStart, domEnd));
      const dw       = Math.max(dx2 - dx1, 3);
      const domCol   = _domainColor(d.dom.target);
      const dy       = y + ORF_H + d.lane * (DOM_H + DOM_G) + 1;

      g.append('rect')
        .attr('x', dx1).attr('width', dw)
        .attr('y', dy).attr('height', DOM_H)
        .attr('rx', 2)
        .attr('fill', domCol).attr('opacity', .9)
        .on('mousemove', evt => VQ.tooltipShow(`
          <div class="vq-tooltip__title">${VQ.esc(d.dom.target)}</div>
          <div class="vq-tooltip__row">
            <span class="vq-tooltip__key">In</span><span>${VQ.esc(orf.name)}</span>
            <span class="vq-tooltip__key">DB</span><span>${VQ.esc(d.dom.database)}</span>
            <span class="vq-tooltip__key">Description</span><span>${VQ.esc(d.dom.description)}</span>
            <span class="vq-tooltip__key">Score</span><span>${d.dom.score}</span>
            <span class="vq-tooltip__key">E-value</span><span>${d.dom.e_value?.toExponential(2) ?? '—'}</span>
            <span class="vq-tooltip__key">aa range</span><span>${d.dom.start}–${d.dom.stop}</span>
          </div>`, evt))
        .on('mouseleave', VQ.tooltipHide);
    });
  });

  // ── Legend ──────────────────────────────────────────────────────────────
  const legendG = svg.append('g').attr('transform', `translate(${PAD_L}, ${totalH - 18})`);
  legendG.append('rect').attr('width', 12).attr('height', 9).attr('rx', 2)
    .attr('fill', 'var(--vq-accent)');
  legendG.append('text').attr('x', 18).attr('y', 8.5)
    .style('font-size', '9.5px').style('fill', 'var(--vq-text-3)').text('(+) ORF');
  legendG.append('rect').attr('x', 70).attr('width', 12).attr('height', 9).attr('rx', 2)
    .attr('fill', 'var(--vq-warning)');
  legendG.append('text').attr('x', 88).attr('y', 8.5)
    .style('font-size', '9.5px').style('fill', 'var(--vq-text-3)').text('(−) ORF');
  legendG.append('rect').attr('x', 140).attr('width', 12).attr('height', 5).attr('rx', 1)
    .attr('fill', 'var(--vq-dom-1)').attr('y', 2);
  legendG.append('text').attr('x', 158).attr('y', 8.5)
    .style('font-size', '9.5px').style('fill', 'var(--vq-text-3)').text('HMM domain');
  if (!fluidMode) {
    legendG.append('text').attr('x', 230).attr('y', 8.5)
      .style('font-size', '9.5px').style('fill', 'var(--vq-text-3)')
      .text(`↔ ${seqLen.toLocaleString()} nt · scroll horizontally`);
  }

  return svg.node();
}

// ── Domain lane assignment (within an ORF) ─────────────────────────────────

function _assignDomainLanes(domains) {
  const sorted = [...domains].sort((a, b) => a.start - b.start);
  const lanes  = [];
  return sorted.map(d => {
    for (let lane = 0; lane < 20; lane++) {
      if (!lanes[lane]) lanes[lane] = [];
      const overlaps = lanes[lane].some(([s, e]) =>
        d.start < e && d.stop > s);
      if (!overlaps) {
        lanes[lane].push([d.start, d.stop]);
        return { dom: d, lane };
      }
    }
    return { dom: d, lane: 0 };
  });
}

function _domainColor(target) {
  if (_VW.domainMap[target]) return _VW.domainMap[target];
  const col = _DOM_COLOURS[_VW.colourIdx % _DOM_COLOURS.length];
  _VW.colourIdx++;
  _VW.domainMap[target] = col;
  return col;
}


window.vqInitViewer = vqInitViewer;
})();

  'var(--vq-tax-flaviviridae)','var(--vq-tax-parvoviridae)',

  }

      </div>
      <div class="vq-section-actions">

function _buildTree(sequences) {

    const tax = seq.taxonomy || {};

      tax.phylum || 'Unclassified',
      tax.order  || 'Unclassified',
      tax.family || 'Unclassified',
      tax.genus  || 'Unclassified',

    let key    = '';
    parts.forEach((name, depth) => {
      key += '/' + name;
      if (!idx[key]) {

        parent.children.push(node);

      parent = idx[key];

      name:    seq.id,
      seq_id:  seq.id,
      family:  tax.family || 'Unclassified',

function _allFamilies(tree) {

  function walk(node) {

// ── Filter ─────────────────────────────────────────────────────────────────

function _filteredTree() {
  if (!_TAX.family) return _TAX.tree;
  // Deep-clone with pruning: keep only branches that lead to leaves with this family.
  function prune(node) {
    if (node.is_leaf) {
      return node.family === _TAX.family ? { ...node } : null;
    }
    const kids = (node.children || []).map(prune).filter(Boolean);
    if (!kids.length && node !== _TAX.tree) return null;
    return { ...node, children: kids };
  }
  const pruned = prune(_TAX.tree);
  return pruned || { name: 'Viruses', children: [] };
}

// ── Family colour ──────────────────────────────────────────────────────────

function _familyColor(family) {
  if (!family || family === 'Unclassified') return 'var(--vq-text-3)';
  const cssVar = '--vq-tax-' + family.toLowerCase();
  const computed = getComputedStyle(document.documentElement).getPropertyValue(cssVar).trim();
  if (computed) return computed;
  if (!_familyColorMap[family]) {
    _familyColorMap[family] = _TAX_PALETTE[_familyIndex % _TAX_PALETTE.length];
    _familyIndex++;

// ── Draw linear tree ───────────────────────────────────────────────────────

function _draw() {

function _drawInner() {
  const wrap = document.getElementById('tax-wrap');

  wrap.innerHTML = '';

  const data = _filteredTree();
  const leaves = _countLeaves(data);
  if (!leaves) {
    wrap.innerHTML = '<div class="vq-empty">No leaves match the filter.</div>';
    _renderLegend([]);

  const W = Math.max(wrap.clientWidth || 0, 720);

  const PAD_T = 28;
  const PAD_B = 28;
  const PAD_L = 90;
  const RIGHT_LABEL_W = 260;
  const MIN_ROW = 26;
  const MAX_ROW = 36;

  // Pick a row height that uses the available vertical space, capped.
  const availH = Math.max(wrap.clientHeight || 0, 520) - PAD_T - PAD_B;
  const rowH   = Math.max(MIN_ROW, Math.min(MAX_ROW, Math.floor(availH / leaves)));

  const drawW  = W - PAD_L - RIGHT_LABEL_W;

  const hierarchy = d3.hierarchy(data)
    .sort((a, b) => d3.ascending(a.data.name, b.data.name));
  d3.cluster().size([treeH, drawW])(hierarchy);

  const svg = d3.create('svg')
    .attr('class', 'vq-genome-svg vq-genome-svg--fluid')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('preserveAspectRatio', 'xMinYMin meet')
    .style('width', '100%').style('height', 'auto');

    .attr('x', 9).attr('y', 4)
    .attr('font-size', 12)

    .attr('cursor', 'pointer')
    .text(d => d.data.name)
    .on('click', (evt, d) => { if (d.data.seq_id) VQ.jumpToViewer(d.data.seq_id); });

  // ── Internal nodes — pill chip centered on the horizontal incoming branch.
  const internalSel = node.filter(d => !d.data.is_leaf && d.depth > 0);

  internalSel.each(function (d) {
    const sel       = d3.select(this);
    const text      = d.data.name;
    // Measure roughly: 6.4px per char @ 12px font, plus padding.
    const w         = Math.max(24, text.length * 6.6 + 14);
    const h         = 18;
    // Center horizontally on the half-branch leading INTO this node.
    const parentY   = d.parent ? d.parent.y : 0;
    const segLen    = d.y - parentY;
    const cx        = -segLen / 2;   // relative to node (which is at d.y)
    const cy        = -h / 2 - 1;    // sit ABOVE the horizontal link

    sel.append('rect')
      .attr('x', cx - w / 2).attr('y', cy)
      .attr('width', w).attr('height', h)
      .attr('rx', h / 2).attr('ry', h / 2)
      .attr('fill', 'var(--vq-surface)')
      .attr('stroke', 'var(--vq-border-dark)')
      .attr('stroke-width', 1);
    sel.append('text')
      .attr('x', cx).attr('y', cy + h / 2 + 4)
      .attr('text-anchor', 'middle')
      .attr('font-size', 11)
      .attr('font-weight', 500)
      .attr('fill', 'var(--vq-text-2)')
      .attr('font-family', 'var(--vq-font)')
      .text(text);

    // Small node dot at the actual branch junction
    sel.append('circle')
      .attr('r', 3.5)
      .attr('fill', d.depth === 1 ? 'var(--vq-accent)' : 'var(--vq-accent-dark)')
      .attr('stroke', '#fff').attr('stroke-width', 1.5);
  });

  internalSel
    .on('mousemove', (evt, d) => VQ.tooltipShow(
      `<div class="vq-tooltip__title">${VQ.esc(d.data.name)}</div>
       <div class="vq-tooltip__row">
         <span class="vq-tooltip__key">Depth</span><span>${d.depth}</span>
         <span class="vq-tooltip__key">Leaves</span><span>${d.leaves().length}</span>
       </div>`, evt))
    .on('mouseleave', VQ.tooltipHide);

  // Root label (depth 0)
  node.filter(d => d.depth === 0)
    .append('circle')
      .attr('r', 5)
      .attr('fill', 'var(--vq-primary)')
      .attr('stroke', '#fff').attr('stroke-width', 2);
  node.filter(d => d.depth === 0)
    .append('text')
      .attr('x', -10).attr('y', 4)
      .attr('text-anchor', 'end')
      .attr('font-size', 12)
      .attr('font-weight', 600)
      .attr('fill', 'var(--vq-primary)')
      .text(d => d.data.name);

  wrap.appendChild(svg.node());

  const families = [...new Set(
    hierarchy.leaves().map(l => l.data.family).filter(Boolean)
  )].sort();
  _renderLegend(families);
}

function _countLeaves(node) {
  if (node.is_leaf) return 1;
  return (node.children || []).reduce((a, c) => a + _countLeaves(c), 0);
}

function _renderLegend(families) {
  const el = document.getElementById('tax-legend');
  if (!el) return;
  if (!families.length) { el.innerHTML = ''; return; }
  el.innerHTML = families.map(f => `
    <button class="vq-legend__item" type="button"
            data-fam="${VQ.esc(f)}"
            style="border:none;background:transparent;padding:0;cursor:pointer;font:inherit;color:inherit;">
      <span class="vq-legend__swatch"
            style="background:${_familyColor(f)};border-radius:50%"></span>
      <span>${VQ.esc(f)}</span>
    </button>`).join('');

  // Clicking a legend swatch toggles the filter
  el.querySelectorAll('[data-fam]').forEach(btn => {
    btn.addEventListener('click', () => {
      const fam = btn.dataset.fam;
      const sel = document.getElementById('tax-family-filter');
      if (!sel) return;
      sel.value = _TAX.family === fam ? '' : fam;
      _TAX.family = sel.value;
      _draw();
    });
  });
}


window.vqInitTaxonomy = vqInitTaxonomy;
})();

      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 320px;gap:var(--vq-space-3);
                align-items:stretch" id="sq-grid">
      <div class="vq-card" style="display:flex;flex-direction:column">
        <div class="vq-card__header">
          <div class="vq-card__title">Viral Sequences</div>
          <span class="vq-panel__count" id="sq-viral-count">0</span>
        </div>
        <div class="vq-card__body" style="padding:12px 14px;flex:1">
          <div id="sq-viral-wrap" style="width:100%"></div>
        </div>
      </div>
      <div class="vq-card" style="display:flex;flex-direction:column">
        <div class="vq-card__header">
          <div class="vq-card__title">${hkTitle}</div>
          <span class="vq-panel__count" id="sq-cons-count">0</span>
        </div>
        <div class="vq-card__body" id="sq-cons-wrap" style="padding:12px 14px;flex:1"></div>
      </div>
    </div>

    ${showRefHk ? `
    <div class="vq-card" style="margin-top:var(--vq-space-3)">
      <div class="vq-card__header">
        <div class="vq-card__title">Reference Housekeeping Genes</div>
        <span class="vq-panel__count" id="sq-refhk-count">0</span>
      </div>
      <div class="vq-card__body" id="sq-refhk-wrap" style="padding:12px 14px"></div>
    </div>` : ''}

    ${_SQ.pathway === 'reference' ? _renderHostHits(salmonQuant.host_viral_hits || []) : ''}
  `;

  // Wire metric toggle
  document.querySelectorAll('[data-metric]').forEach(btn => {
    btn.addEventListener('click', () => _setMetric(btn.dataset.metric));
  });

  // Overlay toggle
  document.getElementById('sq-show-hk')?.addEventListener('change', e => {
    _SQ.showHK = e.target.checked;
    _drawViralPanel();
  });

  // Export menu
  const exportMenu = document.getElementById('sq-export-menu');
  const exportTog  = exportMenu?.querySelector('[data-menu-toggle]');
  exportTog?.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.vq-menu.open').forEach(m => {
      if (m !== exportMenu) m.classList.remove('open');
    });
    exportMenu.classList.toggle('open');
  });
  exportMenu?.querySelectorAll('[data-fmt]').forEach(item => {
    item.addEventListener('click', e => {
      e.stopPropagation();
      exportMenu.classList.remove('open');
      const svg = document.querySelector('#sq-viral-wrap svg');
      if (!svg) return;
      if (item.dataset.fmt === 'png') VQ.exportPNG(svg, 'salmon_viral.png');
      else                            VQ.exportSVG(svg, 'salmon_viral.svg');
    });
  });

  // Responsive grid
  const grid  = document.getElementById('sq-grid');
  const apply = () => {
    if (window.innerWidth < 980) grid.style.gridTemplateColumns = '1fr';
    else                         grid.style.gridTemplateColumns = '1fr 320px';
  };
  apply();
  window.addEventListener('resize', () => {
    apply();
    clearTimeout(_SQ.resizeT);
    _SQ.resizeT = setTimeout(_draw, 150);
  });

  // ResizeObserver — re-draw once the wraps actually have real widths
  let lastW = 0;
  const ro = new ResizeObserver(() => {
    const w = document.getElementById('sq-viral-wrap')?.clientWidth || 0;
    if (!w || w === lastW) return;
    lastW = w;
    clearTimeout(_SQ.resizeT);
    _SQ.resizeT = setTimeout(_draw, 60);
  });
  const viralWrap = document.getElementById('sq-viral-wrap');
  if (viralWrap) ro.observe(viralWrap);

  _draw();
}

function _setMetric(metric) {
  _SQ.metric = metric;
  document.querySelectorAll('[data-metric]').forEach(btn => {
    const active = btn.dataset.metric === metric;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', String(active));
  });
  _draw();
}

function _draw() {
  _drawViralPanel();
  _drawConsPanel();
  if (_SQ.pathway === 'reference') _drawRefHkPanel();
}

// ── Housekeeping medians per kingdom ───────────────────────────────────────

function _hkMedians() {
  const cons   = (_SQ.data.conserved_quant || []);
  const metric = _SQ.metric;
  const byKingdom = {};
  cons.forEach(c => {
    const k = c.kingdom || 'Unknown';
    (byKingdom[k] ??= []).push(c[metric] ?? 0);
  });
  return Object.keys(byKingdom).map(k => ({
    kingdom: k,
    values:  byKingdom[k],
    median:  d3.quantile(byKingdom[k].slice().sort(d3.ascending), 0.5) ?? 0,
  }));
}

// ── Viral panel ────────────────────────────────────────────────────────────

function _drawViralPanel() {
  const wrap = document.getElementById('sq-viral-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';

  const viral  = (_SQ.data.viral_quant || []);
  const metric = _SQ.metric;
  const label  = metric === 'tpm' ? 'TPM' : 'Reads';

  const countEl = document.getElementById('sq-viral-count');
  if (countEl) countEl.textContent = `${viral.length} sequence${viral.length !== 1 ? 's' : ''}`;

  if (!viral.length) {
    wrap.innerHTML = '<div class="vq-empty">No viral quantification data.</div>';
    return;
  }

  // Map seq_id → cluster_id
  const seqCluster = {};
  (_SQ.clusters || []).forEach(c => {
    c.members.forEach(m => { seqCluster[m.seq_id] = c.cluster_id; });
  });

  // Group
  const groups = {};
  viral.forEach(v => {
    const cid = seqCluster[v.name];
    const key = cid != null ? 'cluster_' + cid : v.name;
    (groups[key] ??= { label: key, values: [], seqIds: [] }).values.push(v[metric] ?? 0);
    groups[key].seqIds.push(v.name);
  });

  // Sort by median descending
  const keys = Object.keys(groups).sort((a, b) => {
    const ma = d3.quantile(groups[a].values.slice().sort(d3.ascending), 0.5) ?? 0;
    const mb = d3.quantile(groups[b].values.slice().sort(d3.ascending), 0.5) ?? 0;
    return mb - ma;
  });

  // Geometry
  const containerW = wrap.clientWidth || 700;
  const W     = Math.max(containerW, 560);
  const PAD_L = 200;
  const PAD_R = 30;
  const PAD_T = 26;
  const ROW_H = 30;
  const drawW = W - PAD_L - PAD_R;

  const allVals = viral.map(v => v[metric] ?? 0).slice();
  if (_SQ.showHK) _hkMedians().forEach(h => allVals.push(h.median));
  const maxVal = d3.max(allVals) || 1;

  const xScale = d3.scaleLinear([0, maxVal], [0, drawW]);

  const HK      = _SQ.showHK ? _hkMedians() : [];
  const overlayH = HK.length ? 24 : 0;
  const PAD_B   = 60 + overlayH;
  const H       = PAD_T + keys.length * ROW_H + PAD_B;

  const svg = d3.create('svg')
    .attr('class', 'vq-genome-svg vq-genome-svg--fluid')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('preserveAspectRatio', 'xMinYMin meet')
    .style('width', '100%').style('height', 'auto');

  // X axis
  const gridH = H - PAD_T - PAD_B;
  const axG = svg.append('g')
    .attr('transform', `translate(${PAD_L},${PAD_T})`)
    .call(d3.axisTop(xScale).ticks(Math.max(4, Math.round(W / 140))).tickSize(0));
  axG.selectAll('.tick line')
    .attr('y1', 0).attr('y2', gridH)
    .attr('stroke', '#dde3ec').attr('stroke-dasharray', '3,3');
  axG.select('.domain').remove();
  axG.selectAll('.tick text')
    .style('font-size', '10px').style('fill', '#94a3b8');

  // X axis label
  svg.append('text')
    .attr('x', PAD_L + drawW / 2)
    .attr('y', H - 12 - overlayH)
    .attr('text-anchor', 'middle')
    .attr('font-size', 11)
    .attr('fill', 'var(--vq-text-2)')
    .text(label);

  // Rows
  keys.forEach((key, i) => {
    const grp  = groups[key];
    const vals = grp.values.slice().sort(d3.ascending);
    const y    = PAD_T + i * ROW_H + ROW_H / 2;
    const isSingleton = vals.length === 1;
    const gEl  = svg.append('g').attr('transform', `translate(${PAD_L},0)`);

    const fullLabel = grp.label;
    const truncated = fullLabel.length > 28 ? fullLabel.slice(0, 27) + '…' : fullLabel;
    const lbl = svg.append('text')
      .attr('x', PAD_L - 8).attr('y', y + 4)
      .attr('text-anchor', 'end').attr('font-size', 10)
      .attr('fill', 'var(--vq-text-2)').attr('font-family', 'var(--vq-font-mono)')
      .text(truncated);
    if (truncated !== fullLabel) {
      lbl.style('cursor', 'help')
        .on('mousemove', evt => VQ.tooltipShow(
          `<div class="vq-tooltip__title">${VQ.esc(fullLabel)}</div>
           <div class="vq-tooltip__row">
             <span class="vq-tooltip__key">Members</span><span>${vals.length}</span>
           </div>`, evt))
        .on('mouseleave', VQ.tooltipHide);
    }

    if (isSingleton) {
      const cx = xScale(vals[0]);
      gEl.append('circle')
        .attr('cx', cx).attr('cy', y).attr('r', 5)
        .attr('fill', 'var(--vq-accent)')
        .attr('stroke', '#fff').attr('stroke-width', 1)
        .attr('cursor', 'pointer')
        .on('mousemove', evt => VQ.tooltipShow(`
          <div class="vq-tooltip__title">${VQ.esc(grp.seqIds[0])}</div>
          <div class="vq-tooltip__row">
            <span class="vq-tooltip__key">${label}</span><span>${vals[0].toFixed(2)}</span>
          </div>`, evt))
        .on('mouseleave', VQ.tooltipHide)
        .on('click', () => VQ.jumpToViewer(grp.seqIds[0]));
    } else {
      const q1  = d3.quantile(vals, 0.25);
      const med = d3.quantile(vals, 0.5);
      const q3  = d3.quantile(vals, 0.75);
      const iqr = q3 - q1;
      const lo  = Math.max(d3.min(vals), q1 - 1.5 * iqr);
      const hi  = Math.min(d3.max(vals), q3 + 1.5 * iqr);
      const bh  = 14;

      gEl.append('line')
        .attr('x1', xScale(lo)).attr('x2', xScale(hi))
        .attr('y1', y).attr('y2', y)
        .attr('stroke', 'var(--vq-accent)').attr('stroke-width', 1.5);
      [lo, hi].forEach(x => {
        gEl.append('line')
          .attr('x1', xScale(x)).attr('x2', xScale(x))
          .attr('y1', y - bh / 2).attr('y2', y + bh / 2)
          .attr('stroke', 'var(--vq-accent)').attr('stroke-width', 1.5);
      });
      gEl.append('rect')
        .attr('x', xScale(q1)).attr('width', Math.max(xScale(q3) - xScale(q1), 2))
        .attr('y', y - bh / 2).attr('height', bh)
        .attr('rx', 2)
        .attr('fill', 'var(--vq-accent)').attr('opacity', 0.25)
        .attr('stroke', 'var(--vq-accent)').attr('stroke-width', 1.5)
        .on('mousemove', evt => VQ.tooltipShow(`
          <div class="vq-tooltip__title">${VQ.esc(grp.label)}</div>
          <div class="vq-tooltip__row">
            <span class="vq-tooltip__key">Median ${label}</span><span>${med.toFixed(2)}</span>
            <span class="vq-tooltip__key">Q1–Q3</span><span>${q1.toFixed(2)}–${q3.toFixed(2)}</span>
            <span class="vq-tooltip__key">Members</span><span>${vals.length}</span>
          </div>`, evt))
        .on('mouseleave', VQ.tooltipHide);
      gEl.append('line')
        .attr('x1', xScale(med)).attr('x2', xScale(med))
        .attr('y1', y - bh / 2).attr('y2', y + bh / 2)
        .attr('stroke', 'var(--vq-primary)').attr('stroke-width', 2);

      vals.filter(v => v < lo || v > hi).forEach(v => {
        gEl.append('circle')
          .attr('cx', xScale(v)).attr('cy', y).attr('r', 3)
          .attr('fill', 'var(--vq-danger)').attr('opacity', 0.7);
      });
    }
  });

  // Housekeeping overlay: vertical reference lines + bottom legend chips
  if (HK.length) {
    const overlayY = H - PAD_B + 36;
    HK.forEach((h, i) => {
      const x = PAD_L + xScale(h.median);
      svg.append('line')
        .attr('x1', x).attr('x2', x)
        .attr('y1', PAD_T).attr('y2', H - PAD_B)
        .attr('stroke', 'var(--vq-success)')
        .attr('stroke-dasharray', '4,3')
        .attr('stroke-width', 1.2)
        .attr('opacity', 0.7)
        .on('mousemove', evt => VQ.tooltipShow(`
          <div class="vq-tooltip__title">${VQ.esc(h.kingdom)} housekeeping</div>
          <div class="vq-tooltip__row">
            <span class="vq-tooltip__key">Median ${label}</span><span>${h.median.toFixed(2)}</span>
            <span class="vq-tooltip__key">Genes</span><span>${h.values.length}</span>
          </div>`, evt))
        .on('mouseleave', VQ.tooltipHide);

      svg.append('text')
        .attr('x', x).attr('y', PAD_T - 8)
        .attr('text-anchor', 'middle')
        .attr('font-size', 9.5)
        .attr('fill', 'var(--vq-success)')
        .text(h.kingdom.slice(0, 3).toUpperCase());
    });

    svg.append('text')
      .attr('x', PAD_L).attr('y', overlayY)
      .attr('font-size', 11).attr('fill', 'var(--vq-text-2)')
      .text('Housekeeping (median ' + label + '):');
    let lx = PAD_L + 200;
    HK.forEach(h => {
      svg.append('line')
        .attr('x1', lx).attr('x2', lx + 18)
        .attr('y1', overlayY - 4).attr('y2', overlayY - 4)
        .attr('stroke', 'var(--vq-success)')
        .attr('stroke-dasharray', '4,3').attr('stroke-width', 1.5);
      svg.append('text')
        .attr('x', lx + 22).attr('y', overlayY)
        .attr('font-size', 11)
        .attr('fill', 'var(--vq-text-3)')
        .text(`${h.kingdom} (${h.median.toFixed(1)})`);
      lx += 22 + (h.kingdom.length + 8) * 6.2;
    });
  }

  wrap.appendChild(svg.node());
}

// ── Housekeeping / HK-matched contigs panel ────────────────────────────────

function _drawConsPanel() {
  const wrap = document.getElementById('sq-cons-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';

  const cons   = (_SQ.data.conserved_quant || []);
  const metric = _SQ.metric;
  const label  = metric === 'tpm' ? 'TPM' : 'Reads';

  const countEl = document.getElementById('sq-cons-count');
  if (countEl) countEl.textContent = `${cons.length} gene${cons.length !== 1 ? 's' : ''}`;

  if (!cons.length) {
    const msg = _SQ.pathway === 'de_novo'
      ? 'No HK-matched contigs found.'
      : 'No housekeeping data.';
    wrap.innerHTML = `<div class="vq-empty" style="font-size:12px">${msg}</div>`;
    return;
  }

  const byKingdom = {};
  cons.forEach(c => {
    const k = c.kingdom || 'Unknown';
    (byKingdom[k] ??= []).push(c[metric] ?? 0);
  });

  const kingdoms = Object.keys(byKingdom).map(k => {
    const vals = byKingdom[k].slice().sort(d3.ascending);
    return { k, vals, median: d3.quantile(vals, 0.5) ?? 0 };
  }).sort((a, b) => b.median - a.median);

  const maxVal = d3.max(kingdoms.map(x => x.median)) || 1;
  const W      = Math.max(wrap.clientWidth || 280, 250);
  const PAD_L  = 96;
  const PAD_R  = 44;
  const ROW_H  = 28;
  const BAR_H  = 12;
  const H      = kingdoms.length * ROW_H + 36;

  const xScale = d3.scaleLinear([0, maxVal], [0, W - PAD_L - PAD_R]);

  const svg = d3.create('svg')
    .attr('class', 'vq-genome-svg vq-genome-svg--fluid')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('preserveAspectRatio', 'xMinYMin meet')
    .style('width', '100%').style('height', 'auto');

  svg.append('text')
    .attr('x', PAD_L).attr('y', 14)
    .attr('font-size', 10).attr('fill', 'var(--vq-text-3)')
    .text(`Median ${label} per kingdom`);

  kingdoms.forEach((row, i) => {
    const y = 26 + i * ROW_H;

    svg.append('text')
      .attr('x', PAD_L - 8).attr('y', y + BAR_H / 2 + 3.5)
      .attr('text-anchor', 'end')
      .attr('font-size', 11)
      .attr('fill', 'var(--vq-text-2)')
      .text(row.k);

    svg.append('rect')
      .attr('x', PAD_L).attr('y', y)
      .attr('width', W - PAD_L - PAD_R).attr('height', BAR_H)
      .attr('rx', 2)
      .attr('fill', 'var(--vq-bg)');

    const bw = Math.max(xScale(row.median), 2);
    svg.append('rect')
      .attr('x', PAD_L).attr('y', y)
      .attr('width', bw).attr('height', BAR_H)
      .attr('rx', 2)
      .attr('fill', 'var(--vq-success)').attr('opacity', 0.85)
      .on('mousemove', evt => VQ.tooltipShow(`
        <div class="vq-tooltip__title">${VQ.esc(row.k)}</div>
        <div class="vq-tooltip__row">
          <span class="vq-tooltip__key">Median ${label}</span><span>${row.median.toFixed(2)}</span>
          <span class="vq-tooltip__key">Genes</span><span>${row.vals.length}</span>
        </div>`, evt))
      .on('mouseleave', VQ.tooltipHide);

    svg.append('text')
      .attr('x', PAD_L + bw + 6).attr('y', y + BAR_H / 2 + 3.5)
      .attr('font-size', 10).attr('fill', 'var(--vq-text-3)')
      .attr('font-variant-numeric', 'tabular-nums')
      .text(row.median.toFixed(1));
  });

  wrap.appendChild(svg.node());
}

// ── Reference HK genes panel (reference pathway + --hk-genes only) ─────────

function _drawRefHkPanel() {
  const wrap = document.getElementById('sq-refhk-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';

  const refHk  = (_SQ.data.ref_hk_quant || []);
  const metric = _SQ.metric;
  const label  = metric === 'tpm' ? 'TPM' : 'Reads';

  const countEl = document.getElementById('sq-refhk-count');
  if (countEl) countEl.textContent = `${refHk.length} gene${refHk.length !== 1 ? 's' : ''}`;

  if (!refHk.length) {
    wrap.innerHTML = '<div class="vq-empty" style="font-size:12px">No reference HK data.</div>';
    return;
  }

  const sorted = [...refHk].sort((a, b) => (b[metric] ?? 0) - (a[metric] ?? 0));
  const maxVal = (sorted[0]?.[metric] ?? 0) || 1;

  const W     = Math.max(wrap.clientWidth || 600, 400);
  const PAD_L = 180;
  const PAD_R = 60;
  const ROW_H = 24;
  const BAR_H = 10;
  const H     = sorted.length * ROW_H + 36;

  const xScale = d3.scaleLinear([0, maxVal], [0, W - PAD_L - PAD_R]);

  const svg = d3.create('svg')
    .attr('class', 'vq-genome-svg vq-genome-svg--fluid')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('preserveAspectRatio', 'xMinYMin meet')
    .style('width', '100%').style('height', 'auto');

  svg.append('text')
    .attr('x', PAD_L).attr('y', 14)
    .attr('font-size', 10).attr('fill', 'var(--vq-text-3)')
    .text(`${label} per reference HK gene`);

  sorted.forEach((entry, i) => {
    const y     = 26 + i * ROW_H;
    const val   = entry[metric] ?? 0;
    const gName = entry.name.replace(/^VQ_REFHK_/, '');
    const truncated = gName.length > 26 ? gName.slice(0, 25) + '…' : gName;

    const lbl = svg.append('text')
      .attr('x', PAD_L - 8).attr('y', y + BAR_H / 2 + 3.5)
      .attr('text-anchor', 'end')
      .attr('font-size', 10)
      .attr('fill', 'var(--vq-text-2)')
      .attr('font-family', 'var(--vq-font-mono)')
      .text(truncated);
    if (truncated !== gName) {
      lbl.style('cursor', 'help')
        .on('mousemove', evt => VQ.tooltipShow(
          `<div class="vq-tooltip__title">${VQ.esc(gName)}</div>`, evt))
        .on('mouseleave', VQ.tooltipHide);
    }

    svg.append('rect')
      .attr('x', PAD_L).attr('y', y)
      .attr('width', W - PAD_L - PAD_R).attr('height', BAR_H)
      .attr('rx', 2).attr('fill', 'var(--vq-bg)');

    const bw = Math.max(xScale(val), val > 0 ? 2 : 0);
    svg.append('rect')
      .attr('x', PAD_L).attr('y', y)
      .attr('width', bw).attr('height', BAR_H)
      .attr('rx', 2)
      .attr('fill', 'var(--vq-primary)').attr('opacity', 0.7)
      .on('mousemove', evt => VQ.tooltipShow(`
        <div class="vq-tooltip__title">${VQ.esc(gName)}</div>
        <div class="vq-tooltip__row">
          <span class="vq-tooltip__key">${label}</span><span>${val.toFixed(2)}</span>
          <span class="vq-tooltip__key">Reads</span><span>${(entry.num_reads ?? 0).toFixed(0)}</span>
        </div>`, evt))
      .on('mouseleave', VQ.tooltipHide);

    svg.append('text')
      .attr('x', PAD_L + bw + 6).attr('y', y + BAR_H / 2 + 3.5)
      .attr('font-size', 10).attr('fill', 'var(--vq-text-3)')
      .attr('font-variant-numeric', 'tabular-nums')
      .text(val.toFixed(1));
  });

  wrap.appendChild(svg.node());
}

// ── Host–viral hits table ──────────────────────────────────────────────────

function _renderHostHits(hits) {
  if (!hits.length) return '';
  const esc = VQ.esc;

  const rows = hits.map(h => `
    <tr>
      <td class="vq-td--mono">${esc(h.transcript?.name ?? '—')}</td>
      <td class="vq-td--mono">${esc(h.blast_hits?.[0]?.viral_seq_id ?? '—')}</td>
      <td class="vq-td--num">${h.blast_hits?.[0]?.pident?.toFixed(1) ?? '—'}%</td>
      <td class="vq-td--num">${h.blast_hits?.[0]?.qcovhsp ?? '—'}%</td>
      <td class="vq-td--num">${h.transcript?.tpm?.toFixed(2) ?? '—'}</td>
    </tr>`).join('');

  return `
    <div class="vq-card" style="margin-top:var(--vq-space-3)">
      <div class="vq-card__header">
        <div class="vq-card__title">Host–Viral Transcriptome Hits</div>
        <span class="vq-panel__count">${hits.length}</span>
      </div>
      <div class="vq-card__body" style="overflow-x:auto;padding:0">
        <table class="vq-table">
          <thead>
            <tr>
              ${['Host Transcript','Viral Match','Identity','Coverage','TPM']
                .map(h => `<th>${h}</th>`).join('')}
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}


window.vqInitSalmon = vqInitSalmon;
})();
</script>

  <!-- ── Shell controller ───────────────────────────────────── -->
  <script>
  (function () {
    'use strict';

    const tabs     = [...document.querySelectorAll('.vq-nav__tab')];
    const sections = [...document.querySelectorAll('.vq-section')];

    function activate(tab) {
      tabs.forEach(t => {
        const on = t === tab;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
        t.tabIndex = on ? 0 : -1;
      });
      sections.forEach(s => {
        const target = 'section-' + tab.dataset.section;
        const on     = s.id === target;
        s.classList.toggle('active', on);
        if (on) s.removeAttribute('hidden');
        else    s.setAttribute('hidden', '');
      });
    }

    tabs.forEach((tab, i) => {
      tab.addEventListener('click', () => activate(tab));
      tab.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          e.preventDefault();
          const dir  = e.key === 'ArrowRight' ? 1 : -1;
          // Skip hidden tabs (e.g. Salmon when no quant data)
          let j = i;
          for (let step = 0; step < tabs.length; step++) {
            j = (j + dir + tabs.length) % tabs.length;
            if (tabs[j].style.display !== 'none') break;
          }
          tabs[j].focus();
          activate(tabs[j]);
        } else if (e.key === 'Home') {
          e.preventDefault();
          tabs[0].focus(); activate(tabs[0]);
        } else if (e.key === 'End') {
          e.preventDefault();
          const last = tabs.filter(t => t.style.display !== 'none').pop();
          last.focus(); activate(last);
        }
      });
    });

    // --- Salmon tab visibility --------------------------------------
    if (!VQ_REPORT.salmon_quant) {
      document.getElementById('tab-salmon').style.display = 'none';
    }

    // --- Nav meta ---------------------------------------------------
    const meta = VQ_REPORT.meta || {};
    const v    = document.getElementById('nav-version');
    const ts   = document.getElementById('nav-timestamp');
    if (v)  v.textContent  = 'v' + (meta.viralquest_version || '?');
    if (ts) ts.textContent = meta.timestamp
      ? new Date(meta.timestamp).toLocaleDateString()
      : '';

    // --- Init all sections ------------------------------------------
    vqInitStats(VQ_REPORT);
    vqInitClusters(VQ_REPORT.clusters || []);
    vqInitViewer(VQ_REPORT.sequences || []);
    vqInitTaxonomy(VQ_REPORT._taxonomy_tree || null, VQ_REPORT.sequences || []);
    if (VQ_REPORT.salmon_quant) {
      vqInitSalmon(VQ_REPORT.salmon_quant, VQ_REPORT.clusters || []);
    }

  })();
  </script>
