<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViralQuest Report — demo</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="base.css">
</head>
<body>

  <nav class="vq-nav" aria-label="Report sections">
    <div class="vq-nav__logo">
      <img src="assets/logo-text.png" alt="ViralQuest">
    </div>

    <div class="vq-nav__tabs" role="tablist" aria-label="Report sections">
      <button class="vq-nav__tab active" data-section="stats"    role="tab"
              id="tab-stats"    aria-controls="section-stats"    aria-selected="true"  tabindex="0">General Stats</button>
      <button class="vq-nav__tab"        data-section="clusters" role="tab"
              id="tab-clusters" aria-controls="section-clusters" aria-selected="false" tabindex="-1">Cluster Analysis</button>
      <button class="vq-nav__tab"        data-section="viewer"   role="tab"
              id="tab-viewer"   aria-controls="section-viewer"   aria-selected="false" tabindex="-1">Sequence Viewer</button>
      <button class="vq-nav__tab"        data-section="taxonomy" role="tab"
              id="tab-taxonomy" aria-controls="section-taxonomy" aria-selected="false" tabindex="-1">Taxonomy</button>
      <button class="vq-nav__tab"        data-section="salmon"   role="tab"
              id="tab-salmon"   aria-controls="section-salmon"   aria-selected="false" tabindex="-1">Salmon Quant</button>
    </div>

    <div class="vq-nav__meta">
      <span id="nav-version"></span>
      <span>·</span>
      <span id="nav-timestamp"></span>
    </div>
  </nav>

  <main class="vq-main">
    <section class="vq-section active" id="section-stats"    role="tabpanel" aria-labelledby="tab-stats"></section>
    <section class="vq-section"        id="section-clusters" role="tabpanel" aria-labelledby="tab-clusters"    hidden></section>
    <section class="vq-section"        id="section-viewer"   role="tabpanel" aria-labelledby="tab-viewer"      hidden></section>
    <section class="vq-section"        id="section-taxonomy" role="tabpanel" aria-labelledby="tab-taxonomy"    hidden></section>
    <section class="vq-section"        id="section-salmon"   role="tabpanel" aria-labelledby="tab-salmon"      hidden></section>
  </main>

  <div class="vq-tooltip" id="vq-tooltip" role="tooltip" aria-live="polite"></div>

  <!-- Mock data (Python pipeline replaces this) -->
  <script src="demo-data.js"></script>

  <!-- D3 v7 -->
  <script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>

  <!-- Component scripts -->
  <script src="export.js"></script>
  <script src="section_stats.js"></script>
  <script src="section_clusters.js"></script>
  <script src="section_viewer.js"></script>
  <script src="section_taxonomy.js"></script>
  <script src="section_salmon.js"></script>

  <!-- Shell controller -->
  <script>
  (function () {
    'use strict';

    const tabs     = [...document.querySelectorAll('.vq-nav__tab')];
    const sections = [...document.querySelectorAll('.vq-section')];

    function activate(tab) {
      tabs.forEach(t => {
        const on = t === tab;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
        t.tabIndex = on ? 0 : -1;
      });
      sections.forEach(s => {
        const target = 'section-' + tab.dataset.section;
        const on     = s.id === target;
        s.classList.toggle('active', on);
        if (on) s.removeAttribute('hidden');
        else    s.setAttribute('hidden', '');
      });
    }

    tabs.forEach((tab, i) => {
      tab.addEventListener('click', () => activate(tab));
      tab.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          e.preventDefault();
          const dir = e.key === 'ArrowRight' ? 1 : -1;
          let j = i;
          for (let step = 0; step < tabs.length; step++) {
            j = (j + dir + tabs.length) % tabs.length;
            if (tabs[j].style.display !== 'none') break;
          }
          tabs[j].focus();
          activate(tabs[j]);
        } else if (e.key === 'Home') {
          e.preventDefault();
          tabs[0].focus(); activate(tabs[0]);
        } else if (e.key === 'End') {
          e.preventDefault();
          const last = tabs.filter(t => t.style.display !== 'none').pop();
          last.focus(); activate(last);
        }
      });
    });

    if (!VQ_REPORT.salmon_quant) {
      document.getElementById('tab-salmon').style.display = 'none';
    }

    const meta = VQ_REPORT.meta || {};
    const v    = document.getElementById('nav-version');
    const ts   = document.getElementById('nav-timestamp');
    if (v)  v.textContent  = 'v' + (meta.viralquest_version || '?');
    if (ts) ts.textContent = meta.timestamp
      ? new Date(meta.timestamp).toLocaleDateString()
      : '';

    vqInitStats(VQ_REPORT);
    vqInitClusters(VQ_REPORT.clusters || []);
    vqInitViewer(VQ_REPORT.sequences || []);
    vqInitTaxonomy(VQ_REPORT._taxonomy_tree || null, VQ_REPORT.sequences || []);
    if (VQ_REPORT.salmon_quant) {
      vqInitSalmon(VQ_REPORT.salmon_quant, VQ_REPORT.clusters || []);
    }
  })();
  </script>
</body>
</html>
