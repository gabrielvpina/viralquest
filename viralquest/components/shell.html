<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViralQuest Report — {{SAMPLE_NAME}}</title>
  <link rel="icon" href="{{VQ_FAVICON}}" type="image/png">

  <!-- All styles are inlined by html_report.py — placeholder below -->
  <style>{{VQ_STYLES}}</style>
</head>
<body>

  <!-- ── Navigation ─────────────────────────────────────────── -->
  <nav class="vq-nav" aria-label="Report sections">
    <div class="vq-nav__logo">
      <img src="{{VQ_LOGO}}" alt="ViralQuest">
    </div>

    <div class="vq-nav__tabs" role="tablist" aria-label="Report sections">
      <button class="vq-nav__tab vq-nav__tab--about" data-section="about" role="tab"
              id="tab-about"    aria-controls="section-about"    aria-selected="false" tabindex="-1">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        About
      </button>
      <button class="vq-nav__tab active" data-section="stats"    role="tab"
              id="tab-stats"    aria-controls="section-stats"    aria-selected="true"  tabindex="0">General Stats</button>
      <button class="vq-nav__tab"        data-section="clusters" role="tab"
              id="tab-clusters" aria-controls="section-clusters" aria-selected="false" tabindex="-1">Cluster Analysis</button>
      <button class="vq-nav__tab"        data-section="viewer"   role="tab"
              id="tab-viewer"   aria-controls="section-viewer"   aria-selected="false" tabindex="-1">Sequence Viewer</button>
      <button class="vq-nav__tab"        data-section="taxonomy" role="tab"
              id="tab-taxonomy" aria-controls="section-taxonomy" aria-selected="false" tabindex="-1">Taxonomy</button>
      <button class="vq-nav__tab"        data-section="salmon"   role="tab"
              id="tab-salmon"   aria-controls="section-salmon"   aria-selected="false" tabindex="-1">Salmon Quant</button>
      <button class="vq-nav__tab"        data-section="readqc"   role="tab"
              id="tab-readqc"   aria-controls="section-readqc"   aria-selected="false" tabindex="-1">Read QC</button>
    </div>

    <div class="vq-nav__meta">
      <span id="nav-version"></span>
      <span>·</span>
      <span id="nav-timestamp"></span>
    </div>
  </nav>

  <!-- ── Sections ───────────────────────────────────────────── -->
  <main class="vq-main">

    <section class="vq-section"        id="section-about"   role="tabpanel" aria-labelledby="tab-about"    hidden></section>
    <section class="vq-section active" id="section-stats"    role="tabpanel" aria-labelledby="tab-stats"></section>
    <section class="vq-section"        id="section-clusters" role="tabpanel" aria-labelledby="tab-clusters"    hidden></section>
    <section class="vq-section"        id="section-viewer"   role="tabpanel" aria-labelledby="tab-viewer"      hidden></section>
    <section class="vq-section"        id="section-taxonomy" role="tabpanel" aria-labelledby="tab-taxonomy"    hidden></section>
    <section class="vq-section"        id="section-salmon"   role="tabpanel" aria-labelledby="tab-salmon"      hidden></section>
    <section class="vq-section"        id="section-readqc"   role="tabpanel" aria-labelledby="tab-readqc"      hidden></section>

  </main>

  <!-- ── Shared tooltip ─────────────────────────────────────── -->
  <div class="vq-tooltip" id="vq-tooltip" role="tooltip" aria-live="polite"></div>

  <!-- ── Back to top ──────────────────────────────────────────── -->
  <button class="vq-back-top" id="vq-back-top" aria-label="Back to top" title="Back to top">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <!-- ── Report data (injected by html_report.py) ───────────── -->
  <script>const VQ_REPORT = {{VQ_DATA}};</script>

  <!-- ── D3 v7 (inlined by html_report.py) ─────────────────── -->
  <script>{{VQ_D3}}</script>

  <!-- ── Component scripts (inlined by html_report.py) ──────── -->
  <script>{{VQ_EXPORT}}</script>
  <script>{{VQ_ABOUT}}</script>
  <script>{{VQ_STATS}}</script>
  <script>{{VQ_CLUSTERS}}</script>
  <script>{{VQ_VIEWER}}</script>
  <script>{{VQ_TAXONOMY}}</script>
  <script>{{VQ_SALMON}}</script>
  <script>{{VQ_READQC}}</script>

  <!-- ── Shell controller ───────────────────────────────────── -->
  <script>
  (function () {
    'use strict';

    const tabs     = [...document.querySelectorAll('.vq-nav__tab')];
    const sections = [...document.querySelectorAll('.vq-section')];

    function activate(tab) {
      tabs.forEach(t => {
        const on = t === tab;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
        t.tabIndex = on ? 0 : -1;
      });
      sections.forEach(s => {
        const target = 'section-' + tab.dataset.section;
        const on     = s.id === target;
        s.classList.toggle('active', on);
        if (on) s.removeAttribute('hidden');
        else    s.setAttribute('hidden', '');
      });
    }

    tabs.forEach((tab, i) => {
      tab.addEventListener('click', () => activate(tab));
      tab.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          e.preventDefault();
          const dir  = e.key === 'ArrowRight' ? 1 : -1;
          // Skip hidden tabs (e.g. Salmon when no quant data)
          let j = i;
          for (let step = 0; step < tabs.length; step++) {
            j = (j + dir + tabs.length) % tabs.length;
            if (tabs[j].style.display !== 'none') break;
          }
          tabs[j].focus();
          activate(tabs[j]);
        } else if (e.key === 'Home') {
          e.preventDefault();
          tabs[0].focus(); activate(tabs[0]);
        } else if (e.key === 'End') {
          e.preventDefault();
          const last = tabs.filter(t => t.style.display !== 'none').pop();
          last.focus(); activate(last);
        }
      });
    });

    // --- Salmon tab visibility --------------------------------------
    if (!VQ_REPORT.salmon_quant) {
      document.getElementById('tab-salmon').style.display = 'none';
    }

    // --- Read QC tab visibility -------------------------------------
    if (!VQ_REPORT.read_qc) {
      document.getElementById('tab-readqc').style.display = 'none';
    }

    // --- Back to top ------------------------------------------------
    const backTop = document.getElementById('vq-back-top');
    let activeSection = 'stats';

    function updateBackTop() {
      const show = window.scrollY > 300 && activeSection !== 'stats';
      backTop?.classList.toggle('visible', show);
    }

    const _origActivate = activate;
    function activateWithScroll(tab) {
      activeSection = tab.dataset.section;
      _origActivate(tab);
      updateBackTop();
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => { activeSection = tab.dataset.section; updateBackTop(); });
    });

    window.addEventListener('scroll', updateBackTop, { passive: true });

    backTop?.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // --- Nav meta ---------------------------------------------------
    const meta = VQ_REPORT.meta || {};
    const v    = document.getElementById('nav-version');
    const ts   = document.getElementById('nav-timestamp');
    if (v)  v.textContent  = 'v' + (meta.viralquest_version || '?');
    if (ts) ts.textContent = meta.timestamp
      ? new Date(meta.timestamp).toLocaleDateString()
      : '';

    // --- Init all sections ------------------------------------------
    vqInitAbout();
    vqInitStats(VQ_REPORT);
    vqInitClusters(VQ_REPORT.clusters || []);
    vqInitViewer(VQ_REPORT.sequences || []);
    vqInitTaxonomy(VQ_REPORT._taxonomy_tree || null, VQ_REPORT.sequences || []);
    if (VQ_REPORT.salmon_quant) {
      vqInitSalmon(VQ_REPORT.salmon_quant, VQ_REPORT.clusters || []);
    }
    if (VQ_REPORT.read_qc) {
      vqInitReadQc(VQ_REPORT.read_qc, VQ_REPORT.readqc_stats, VQ_REPORT.seq_quality_stats);
    }

  })();
  </script>

</body>
</html>
