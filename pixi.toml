[workspace]
authors = ["gabrielvpina <gvpina.rodrigues@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "vq-refactor"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
start = "python3 main.py"

[dependencies]
python = "3.12.*"
pandas = ">=3.0.2,<4"
numpy = ">=2.4.3,<3"
biopython = ">=1.87,<2"
tqdm = ">=4.67.3,<5"
loguru = ">=0.7.3,<0.8"
httpx = ">=0.28.1,<0.29"
requests = ">=2.33.1,<3"
pooch = ">=1.9.0,<2"
orfipy = ">=0.0.4,<0.0.5"
pytest = ">=9.0.3,<10"
diamond = ">=2.1.24,<3"
pyhmmer = ">=0.12.0,<0.13"

[pypi-dependencies]
bio = ">=1.8.1, <2"
biothings-client = ">=0.5.0, <0.6"
gprofiler-official = ">=1.0.0, <2"
mygene = ">=3.2.2, <4"
loguru = "*"
orfipy = ">=0.0.4, <0.0.5"

