[tool.pytest.ini_options]
pythonpath = [
  "."
]

[project]
name = "viralquest"
version = "3.0.0"
description = "A bioinformatics tool for viral genome analysis and characterization."
readme = "README.md"
authors = [{name = "Gabriel Rodrigues", email = "gvpina.rodrigues@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["bioinformatics", "viral genomics", "genome annotation", "blast", "hmmer"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "biopython>=1.87",
    "loguru>=0.7",
    "numpy>=2.0",
    "pandas>=2.0",
    "requests>=2.28",
    "tqdm>=4.60",
    "pooch>=1.6",
    "mygene>=3.2",
    "gprofiler-official>=1.0",
    "httpx>=0.24",
    "rich>=13.0",
    "setproctitle>=1.3",
    "orfipy>=0.0.4",
    "pyhmmer>=0.10.0",
    "gdown>=5.0",
    "ollama>=0.4.7",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/gabrielvpina/viralquest"
Repository = "https://github.com/gabrielvpina/viralquest"
Documentation = "https://github.com/gabrielvpina/viralquest/blob/main/README.md"
"Bug Reports" = "https://github.com/gabrielvpina/viralquest/issues"

[project.scripts]
viralquest          = "viralquest.cli:main"
viralquest-report   = "viralquest.cli_report:main"
viralquest-setup    = "viralquest.setup_env:setup"
viralquest-download = "viralquest.setup_env:download"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["viralquest*"]

[tool.setuptools.package-data]
"viralquest" = [
    "bin/*", "misc/*",
    "components/*", "components/assets/*",
    "components-report/*", "components-report/assets/*",
]
